# exitctl calibration corpus (T098, FR-041, SC-004, SC-005, research R21)
#
# Consumed by the developer-only tool `go run ./tools/calibrate --corpus calibration/corpus.yaml`
# (T099). The tool may use the network: it clones each repository at the pinned commit into a
# cache directory and runs the scoring engine in-process with the built-in catalog. The product
# binary itself never fetches anything.
#
# Fields of each entry under `repos`:
#   url                   Public HTTPS clone URL (GitHub). No credentials, no private repos.
#   commit                Full 40-character commit SHA the repository is pinned to. Never a
#                         branch or tag: results must be reproducible. SHAs were taken from
#                         `git ls-remote <url> HEAD` on 2026-10-06. To refresh an entry, re-run
#                         that command and re-confirm the expected band.
#   expected_band         Inclusive grade range "X-Y" over the grade scale A, B, C, D, E
#                         (data model grade_bands: A 0-9, B 10-24, C 25-39, D 40-54, E 55-100).
#                         "C-D" means grade C or D is "within band". A single
#                         grade such as "A" is also valid. SC-004 counts a repo as off by more
#                         than one grade when the actual grade is two or more steps outside the
#                         band (for example actual A against "C-D").
#   expected_band_status  "unconfirmed" = initial estimate made from the repository contents
#                         (managed-service heavy -> D-E, mostly Kubernetes/OSS -> A-B), not yet
#                         reviewed by a maintainer. "confirmed" = a maintainer reviewed the repo
#                         and agrees with the band. The calibration gate is only meaningful once
#                         every entry is confirmed: the MAINTAINER MUST CONFIRM EXPECTED BANDS.
#   clouds                Providers expected in the scan: aws, gcp, azure, oci, kubernetes.
#   notes                 What the repository contains and why the band was chosen.
#
# Grade bands changed on 2026-10-11 (A 0-9, B 10-24, C 25-39, D 40-54, E 55-100), so every
# expected_band below was converted from the old scale (A 0-19, B 20-39, C 40-59, D 60-79,
# F 80-100; the top grade was then called F). A new letter is part of the converted band when
# at least half of its own range lay inside the old numeric range: A-B -> A-C, B-C -> C-D,
# C-D -> D-E, D-F -> E. Because the meaning of the letters changed, every entry is
# "unconfirmed" again; entries that were confirmed before the change can be found in the git
# history of this file.
#
# Release gate (quickstart V11, not run on every commit): at least 20 repos, >= 90% within the
# expected band, none off by more than one grade, median weighted coverage >= 90%.

