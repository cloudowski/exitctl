schema: '1.0'
kind: neutral
id: generic-terraform-local
provider: generic
# Terraform types that only exist in state or on the machine running
# Terraform (random values, local files and keys, sleeps, archives) or that
# read data at plan time. They deploy nothing in a cloud. null_resource and
# terraform_data may run provisioner scripts, which exitctl cannot see.
resource_types:
  terraform:
  - random_*
  - null_resource
  - terraform_data
  - tls_*
  - local_*
  - time_*
  - archive_*
  - http
  - external
