alternatives:
- ref: temporal
  difficulty: high
  compatibility: conceptual
  notes: Workflows become code with durable execution; each connector becomes an explicit API client.
  approved_by: cloudowski
- ref: argo-workflows
  difficulty: high
  compatibility: conceptual
  notes: Container-based DAG workflows on Kubernetes; connectors replaced by containers or scripts.
  approved_by: cloudowski
- ref: knative
  difficulty: high
  compatibility: conceptual
  notes: Event-driven steps as services with Knative Eventing; orchestration logic moves into code.
  approved_by: cloudowski
