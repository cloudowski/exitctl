schema: '1.0'
kind: service
id: azure.resource-manager
provider: azure
name: Azure Resource Manager (resource groups, subscriptions, policy)
category: identity.iam
resource_types:
  terraform:
  - azurerm_resource_group
  - azurerm_management_group
  - azurerm_management_group_subscription_association
  - azurerm_subscription
  - azurerm_resource_group_template_deployment
  - azurerm_subscription_template_deployment
  - azurerm_management_group_template_deployment
  - azurerm_tenant_template_deployment
  - azurerm_resource_deployment_script_azure_cli
  - azurerm_resource_deployment_script_azure_power_shell
  - azurerm_management_lock
  - azurerm_resource_provider_registration
  - azurerm_policy_definition
  - azurerm_policy_set_definition
  - azurerm_resource_group_policy_assignment
  - azurerm_subscription_policy_assignment
  - azurerm_management_group_policy_assignment
  - azurerm_resource_policy_assignment
  - azurerm_resource_policy_remediation
  - azurerm_resource_group_policy_remediation
  - azurerm_subscription_policy_remediation
  - azurerm_management_group_policy_remediation
  - azurerm_template_spec_version
  kubernetes:
  - {group: resources.azure.com, kind: ResourceGroup}
traits:
- {id: operational-tooling-coupling, level: low, reason: 'Resource groups, subscriptions and management groups scope every Azure resource, RBAC and billing.'}
- {id: provider-network-construct, level: low, reason: Resource group and subscription boundaries shape how environments are laid out.}
rules:
- id: azure.resource-manager.arm-templates
  match: {resource_type: [azurerm_resource_group_template_deployment, azurerm_subscription_template_deployment, azurerm_management_group_template_deployment, azurerm_tenant_template_deployment, azurerm_template_spec_version]}
  then: {add_trait: proprietary-workflow-definition, level: medium, evidence: template_content}
- id: azure.resource-manager.policy
  match: {resource_type: [azurerm_policy_definition, azurerm_policy_set_definition]}
  then: {set_level: {trait: operational-tooling-coupling, level: medium}}
edge_hints:
- {resource_type: azurerm_management_group_subscription_association, attribute: management_group_id, edge_kind: containment}
- {resource_type: azurerm_resource_group_template_deployment, attribute: resource_group_name, edge_kind: containment}
- {resource_type: azurerm_management_lock, attribute: scope, edge_kind: binding}
alternatives:
- ref: kubernetes
  difficulty: low
  compatibility: conceptual
  notes: Namespaces and labels take over grouping and scoping for workloads moved to clusters.
  approved_by: cloudowski
- ref: scaleway
  difficulty: low
  compatibility: conceptual
  notes: Organizations and Projects provide a similar grouping and access boundary.
  approved_by: cloudowski
- ref: stackit
  difficulty: low
  compatibility: conceptual
  notes: Organizations, folders and projects provide a similar grouping and access boundary.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
  - https://learn.microsoft.com/en-us/azure/governance/policy/overview
  - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/resource_group
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
