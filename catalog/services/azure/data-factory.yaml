alternatives:
- ref: argo-workflows
  difficulty: high
  compatibility: conceptual
  notes: Pipeline steps become container tasks in a DAG; copy activities need explicit tools.
  approved_by: cloudowski
- ref: apache-spark
  difficulty: high
  compatibility: conceptual
  notes: Mapping data flows run on Spark internally; rewrite them as Spark jobs.
  approved_by: cloudowski
- ref: temporal
  difficulty: high
  compatibility: conceptual
  notes: Orchestration as code with retries; each activity becomes code calling the data source.
  approved_by: cloudowski
