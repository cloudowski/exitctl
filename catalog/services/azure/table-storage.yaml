schema: '1.0'
kind: service
id: azure.table-storage
provider: azure
name: Azure Table Storage
category: database.nosql.key-value
resource_types:
  terraform:
  - azurerm_storage_table
  - azurerm_storage_table_entity
  kubernetes:
  - {group: storage.azure.com, kind: StorageAccountsTableService}
  - {group: storage.azure.com, kind: StorageAccountsTableServicesTable}
traits:
- {id: proprietary-api, level: medium, reason: 'The Table API (OData-based entities, PartitionKey/RowKey) exists only in Azure Storage and Cosmos DB.'}
- {id: proprietary-data-model, level: medium, reason: Schemaless entities keyed by PartitionKey and RowKey.}
- {id: proprietary-sdk}
sdk:
- ecosystem: npm
  packages:
  - '@azure/data-tables'
  imports:
  - '[''"]@azure/data-tables(/[^''"]*)?[''"]'
- ecosystem: pypi
  packages:
  - azure-data-tables
  imports:
  - ^\s*(from|import)\s+azure\.data\.tables\b
- ecosystem: go
  packages:
  - github.com/Azure/azure-sdk-for-go/sdk/data/aztables
  imports:
  - '"github\.com/Azure/azure-sdk-for-go/sdk/data/aztables(/[^"]*)?"'
- ecosystem: maven
  packages:
  - com.azure:azure-data-tables
  imports:
  - ^\s*import\s+(static\s+)?com\.azure\.data\.tables\.
- ecosystem: nuget
  packages:
  - Azure.Data.Tables
  - Microsoft.Azure.Cosmos.Table
  imports:
  - ^\s*using\s+(static\s+)?Azure\.Data\.Tables\b
  - ^\s*using\s+(static\s+)?Microsoft\.Azure\.Cosmos\.Table\b
edge_hints:
- {resource_type: azurerm_storage_table, attribute: storage_account_name, edge_kind: containment}
- {resource_type: azurerm_storage_table_entity, attribute: storage_table_id, edge_kind: containment}
alternatives:
- ref: cassandra
  difficulty: medium
  compatibility: conceptual
  notes: Partition and clustering keys map to PartitionKey/RowKey; data export and client rewrite needed.
  approved_by: cloudowski
- ref: scylladb
  difficulty: medium
  compatibility: conceptual
  notes: Wide-column model maps to Table entities; client rewrite needed.
  approved_by: cloudowski
- ref: postgresql
  difficulty: medium
  compatibility: conceptual
  notes: A table keyed by (partition_key, row_key) with a JSONB column covers most uses.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
  - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_table
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
