schema: '1.0'
kind: service
id: azure.managed-disks
provider: azure
name: Azure Managed Disks
category: storage.block
resource_types:
  terraform:
  - azurerm_managed_disk
  - azurerm_virtual_machine_data_disk_attachment
  - azurerm_snapshot
  - azurerm_disk_encryption_set
  - azurerm_disk_access
  - azurerm_managed_disk_sas_token
  kubernetes:
  - {group: compute.azure.com, kind: Disk}
  - {group: compute.azure.com, kind: Snapshot}
  - {group: compute.azure.com, kind: DiskEncryptionSet}
  - {group: compute.azure.com, kind: DiskAccess}
traits:
- {id: proprietary-api, level: low, reason: 'Plain block devices; only provisioning, snapshots and encryption sets are Azure specific.'}
- {id: data-gravity, level: low, reason: Disk images or file-level copies move the data; size drives transfer time.}
kubernetes_bindings:
- match: {kind: StorageClass, field: provisioner, in: [disk.csi.azure.com, kubernetes.io/azure-disk]}
- match: {kind: PersistentVolume, field: spec.csi.driver, in: [disk.csi.azure.com]}
edge_hints:
- {resource_type: azurerm_managed_disk, attribute: resource_group_name, edge_kind: containment}
- {resource_type: azurerm_snapshot, attribute: resource_group_name, edge_kind: containment}
- {resource_type: azurerm_virtual_machine_data_disk_attachment, attribute: managed_disk_id, edge_kind: binding}
- {resource_type: azurerm_virtual_machine_data_disk_attachment, attribute: virtual_machine_id, edge_kind: binding}
alternatives:
- ref: ceph
  difficulty: medium
  compatibility: conceptual
  notes: RBD volumes via ceph-csi replace managed disks; snapshots and encryption reconfigured.
  approved_by: cloudowski
- ref: hetzner
  difficulty: low
  compatibility: conceptual
  notes: Hetzner Cloud Volumes with a CSI driver provide equivalent block storage.
  approved_by: cloudowski
- ref: ovhcloud
  difficulty: low
  compatibility: conceptual
  notes: Block storage volumes with a Cinder CSI driver provide equivalent block storage.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview
  - https://learn.microsoft.com/en-us/azure/aks/azure-disk-csi
  - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/managed_disk
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
