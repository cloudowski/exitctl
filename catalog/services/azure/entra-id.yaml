schema: '1.0'
kind: service
id: azure.entra-id
provider: azure
name: Microsoft Entra ID and Azure RBAC
category: identity.iam
resource_types:
  terraform:
  - azuread_application
  - azuread_application_registration
  - azuread_application_password
  - azuread_application_certificate
  - azuread_application_federated_identity_credential
  - azuread_application_api_access
  - azuread_application_app_role
  - azuread_application_owner
  - azuread_application_redirect_uris
  - azuread_application_identifier_uri
  - azuread_service_principal
  - azuread_service_principal_password
  - azuread_service_principal_certificate
  - azuread_service_principal_delegated_permission_grant
  - azuread_app_role_assignment
  - azuread_group
  - azuread_group_member
  - azuread_user
  - azuread_invitation
  - azuread_directory_role
  - azuread_directory_role_assignment
  - azuread_conditional_access_policy
  - azuread_named_location
  - azuread_administrative_unit
  - azuread_administrative_unit_member
  - azuread_custom_directory_role
  - azuread_claims_mapping_policy
  - azuread_authentication_strength_policy
  - azurerm_role_assignment
  - azurerm_role_definition
  - azurerm_pim_active_role_assignment
  - azurerm_pim_eligible_role_assignment
  - azurerm_role_management_policy
  kubernetes:
  - {group: authorization.azure.com, kind: RoleAssignment}
  - {group: authorization.azure.com, kind: RoleDefinition}
traits:
- {id: proprietary-iam-model, level: medium, reason: 'Azure RBAC role assignments and Entra app registrations, groups and conditional access are Azure specific.'}
- {id: operational-tooling-coupling, level: low, reason: User lifecycle and SSO configuration are managed in the Entra admin plane.}
- {id: non-exportable-data, level: medium, reason: 'Password hashes and MFA registrations of cloud-only users cannot be exported; synced or federated users keep a source of truth outside Entra.'}
sdk:
- ecosystem: npm
  packages:
  - '@azure/msal-node'
  - '@azure/msal-browser'
  - '@azure/msal-react'
  - '@azure/msal-angular'
  - '@microsoft/microsoft-graph-client'
  imports:
  - '[''"]@azure/msal-node(/[^''"]*)?[''"]'
  - '[''"]@azure/msal-browser(/[^''"]*)?[''"]'
  - '[''"]@azure/msal-react(/[^''"]*)?[''"]'
  - '[''"]@azure/msal-angular(/[^''"]*)?[''"]'
  - '[''"]@microsoft/microsoft-graph-client(/[^''"]*)?[''"]'
- ecosystem: pypi
  packages:
  - msal
  - msgraph-sdk
  imports:
  - ^\s*(from|import)\s+msal\b
  - ^\s*(from|import)\s+msgraph\b
- ecosystem: go
  packages:
  - github.com/AzureAD/microsoft-authentication-library-for-go
  - github.com/microsoftgraph/msgraph-sdk-go
  imports:
  - '"github\.com/AzureAD/microsoft-authentication-library-for-go(/[^"]*)?"'
  - '"github\.com/microsoftgraph/msgraph-sdk-go(/[^"]*)?"'
- ecosystem: maven
  packages:
  - com.microsoft.azure:msal4j
  - com.microsoft.graph:microsoft-graph
  imports:
  - ^\s*import\s+(static\s+)?com\.microsoft\.aad\.msal4j\.
  - ^\s*import\s+(static\s+)?com\.microsoft\.graph\.
- ecosystem: nuget
  packages:
  - Microsoft.Identity.Client
  - Microsoft.Identity.Web*
  - Microsoft.Graph
  imports:
  - ^\s*using\s+(static\s+)?Microsoft\.Identity\.Client\b
  - ^\s*using\s+(static\s+)?Microsoft\.Identity\.Web\b
  - ^\s*using\s+(static\s+)?Microsoft\.Graph\b
alternatives:
- ref: keycloak
  difficulty: medium
  compatibility: protocol-compatible
  notes: OIDC and SAML apps switch issuer; users and groups export via Graph API. Azure RBAC itself has no portable equivalent.
  approved_by: cloudowski
  recommended: true
- ref: zitadel
  difficulty: medium
  compatibility: protocol-compatible
  notes: OIDC and SAML identity provider; apps switch issuer, users and groups need migration.
  approved_by: cloudowski
- ref: authentik
  difficulty: medium
  compatibility: protocol-compatible
  notes: OIDC, SAML and LDAP provider; apps switch issuer, users and groups need migration.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://learn.microsoft.com/en-us/entra/fundamentals/whatis
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
  - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/role_assignment
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
