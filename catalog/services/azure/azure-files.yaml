schema: '1.0'
kind: service
id: azure.azure-files
provider: azure
name: Azure Files
category: storage.file
resource_types:
  terraform:
  - azurerm_storage_share
  - azurerm_storage_share_directory
  - azurerm_storage_share_file
  - azurerm_storage_sync
  - azurerm_storage_sync_group
  - azurerm_storage_sync_cloud_endpoint
  - azurerm_storage_sync_server_endpoint
  kubernetes:
  - {group: storage.azure.com, kind: StorageAccountsFileService}
  - {group: storage.azure.com, kind: StorageAccountsFileServicesShare}
traits:
- {id: proprietary-api, level: low, reason: Mounted over standard SMB or NFS; only the management and REST file APIs are Azure specific.}
- {id: data-gravity, level: medium, reason: 'Shared file data must be copied out, typically with rsync or robocopy.'}
sdk:
- ecosystem: npm
  packages:
  - '@azure/storage-file-share'
  imports:
  - '[''"]@azure/storage-file-share(/[^''"]*)?[''"]'
- ecosystem: pypi
  packages:
  - azure-storage-file-share
  imports:
  - ^\s*(from|import)\s+azure\.storage\.fileshare\b
- ecosystem: go
  packages:
  - github.com/Azure/azure-sdk-for-go/sdk/storage/azfile
  imports:
  - '"github\.com/Azure/azure-sdk-for-go/sdk/storage/azfile(/[^"]*)?"'
- ecosystem: maven
  packages:
  - com.azure:azure-storage-file-share
  imports:
  - ^\s*import\s+(static\s+)?com\.azure\.storage\.file\.share\.
- ecosystem: nuget
  packages:
  - Azure.Storage.Files.Shares
  - Microsoft.Azure.Storage.File
  imports:
  - ^\s*using\s+(static\s+)?Azure\.Storage\.Files\.Shares\b
  - ^\s*using\s+(static\s+)?Microsoft\.Azure\.Storage\.File\b
kubernetes_bindings:
- match: {kind: StorageClass, field: provisioner, in: [file.csi.azure.com, kubernetes.io/azure-file]}
- match: {kind: PersistentVolume, field: spec.csi.driver, in: [file.csi.azure.com]}
edge_hints:
- {resource_type: azurerm_storage_share, attribute: storage_account_name, edge_kind: containment}
- {resource_type: azurerm_storage_share, attribute: storage_account_id, edge_kind: containment}
- {resource_type: azurerm_storage_share_directory, attribute: storage_share_id, edge_kind: containment}
- {resource_type: azurerm_storage_share_file, attribute: storage_share_id, edge_kind: containment}
alternatives:
- ref: ceph
  difficulty: medium
  compatibility: protocol-compatible
  notes: CephFS or NFS-Ganesha exports replace NFS shares; SMB needs Samba on top.
  approved_by: cloudowski
- ref: ovhcloud
  difficulty: low
  compatibility: protocol-compatible
  notes: Managed NFS file storage in the EU; mount targets change, data copied with rsync.
  approved_by: cloudowski
- ref: scaleway
  difficulty: low
  compatibility: protocol-compatible
  notes: Managed file storage in the EU; mount configuration changes, data copied with rsync.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
  - https://learn.microsoft.com/en-us/azure/aks/azure-files-csi
  - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_share
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
