- {resource_type: azurerm_linux_virtual_machine_scale_set, attribute: resource_group_name, edge_kind: containment}
- {resource_type: azurerm_windows_virtual_machine_scale_set, attribute: resource_group_name, edge_kind: containment}
- {resource_type: azurerm_linux_virtual_machine_scale_set, attribute: network_interface.ip_configuration.subnet_id, edge_kind: containment}
- {resource_type: azurerm_windows_virtual_machine_scale_set, attribute: network_interface.ip_configuration.subnet_id, edge_kind: containment}
- {resource_type: azurerm_virtual_machine_extension, attribute: virtual_machine_id, edge_kind: containment}
