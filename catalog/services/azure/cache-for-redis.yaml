schema: '1.0'
kind: service
id: azure.cache-for-redis
provider: azure
name: Azure Cache for Redis
category: database.cache
resource_types:
  terraform:
  - azurerm_redis_cache
  - azurerm_redis_firewall_rule
  - azurerm_redis_linked_server
  - azurerm_redis_cache_access_policy
  - azurerm_redis_cache_access_policy_assignment
  - azurerm_redis_enterprise_cluster
  - azurerm_redis_enterprise_database
  - azurerm_managed_redis
  kubernetes:
  - {group: cache.azure.com, kind: Redis}
  - {group: cache.azure.com, kind: RedisFirewallRule}
  - {group: cache.azure.com, kind: RedisLinkedServer}
  - {group: cache.azure.com, kind: RedisPatchSchedule}
  - {group: cache.azure.com, kind: RedisAccessPolicy}
  - {group: cache.azure.com, kind: RedisAccessPolicyAssignment}
  - {group: cache.azure.com, kind: RedisEnterprise}
  - {group: cache.azure.com, kind: RedisEnterpriseDatabase}
traits:
- {id: proprietary-api, level: low, reason: Redis protocol (RESP); clients connect with standard Redis libraries.}
rules:
- id: azure.cache-for-redis.enterprise-modules
  match: {resource_type: [azurerm_redis_enterprise_database]}
  when: {attr: module, exists: true}
  then: {add_trait: managed-only-feature, level: low, evidence: module}
edge_hints:
- {resource_type: azurerm_redis_cache, attribute: resource_group_name, edge_kind: containment}
- {resource_type: azurerm_redis_cache, attribute: subnet_id, edge_kind: containment}
- {resource_type: azurerm_redis_firewall_rule, attribute: redis_cache_name, edge_kind: containment}
- {resource_type: azurerm_redis_enterprise_database, attribute: cluster_id, edge_kind: containment}
alternatives:
- ref: valkey
  difficulty: low
  compatibility: protocol-compatible
  notes: RESP compatible fork of Redis; change the connection string. Enterprise modules (RediSearch, RedisJSON) need checking.
  approved_by: cloudowski
- ref: redis-oss
  difficulty: low
  compatibility: protocol-compatible
  notes: Same protocol; change the connection string.
  approved_by: cloudowski
- ref: ovhcloud
  difficulty: low
  compatibility: protocol-compatible
  notes: Managed Valkey/Redis-compatible caching in the EU.
  approved_by: cloudowski
- ref: scaleway
  difficulty: low
  compatibility: protocol-compatible
  notes: Managed Redis-compatible database in the EU.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-overview
  - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/redis_cache
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
