- {resource_type: azurerm_cdn_frontdoor_security_policy, attribute: cdn_frontdoor_profile_id, edge_kind: containment}
- {resource_type: azurerm_cdn_frontdoor_origin, attribute: cdn_frontdoor_origin_group_id, edge_kind: containment}
- {resource_type: azurerm_cdn_frontdoor_route, attribute: cdn_frontdoor_endpoint_id, edge_kind: containment}
- {resource_type: azurerm_cdn_frontdoor_rule, attribute: cdn_frontdoor_rule_set_id, edge_kind: containment}
