alternatives:
- ref: scaleway
  difficulty: medium
  compatibility: conceptual
  notes: Edge Services provide CDN caching in front of origins; rules and WAF policies are rebuilt.
  approved_by: cloudowski
- ref: ovhcloud
  difficulty: medium
  compatibility: conceptual
  notes: CDN offering in the EU; routing rules are rebuilt.
  approved_by: cloudowski
- ref: nginx
  difficulty: high
  compatibility: conceptual
  notes: Self-hosted caching reverse proxies replace origin routing but not a global edge network.
  approved_by: cloudowski
