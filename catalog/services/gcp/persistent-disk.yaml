schema: '1.0'
kind: service
id: gcp.persistent-disk
provider: gcp
name: Persistent Disk
category: storage.block
resource_types:
  terraform: [google_compute_disk, google_compute_region_disk, google_compute_snapshot, google_compute_instant_snapshot, google_compute_resource_policy, google_compute_disk_resource_policy_attachment, google_compute_region_disk_resource_policy_attachment, google_compute_disk_async_replication, google_compute_disk_iam_binding, google_compute_disk_iam_member, google_compute_disk_iam_policy, google_compute_region_disk_iam_binding, google_compute_region_disk_iam_member, google_compute_region_disk_iam_policy, google_compute_snapshot_iam_binding, google_compute_snapshot_iam_member, google_compute_snapshot_iam_policy]
  kubernetes:
  - {group: compute.cnrm.cloud.google.com, kind: ComputeDisk}
  - {group: compute.cnrm.cloud.google.com, kind: ComputeSnapshot}
  - {group: compute.cnrm.cloud.google.com, kind: ComputeResourcePolicy}
traits:
- {id: operational-tooling-coupling, level: low, reason: 'Block volumes are standard disks; snapshots, replication and disk types are Google-specific.'}
- {id: data-gravity, level: low, reason: Disk data must be copied at file or block level; volume sizes are usually moderate.}
kubernetes_bindings:
- match:
    kind: StorageClass
    field: provisioner
    in: [pd.csi.storage.gke.io, kubernetes.io/gce-pd]
edge_hints:
- {resource_type: google_compute_snapshot, attribute: source_disk, edge_kind: data-flow}
- {resource_type: google_compute_disk, attribute: snapshot, edge_kind: data-flow}
- {resource_type: google_compute_disk_resource_policy_attachment, attribute: disk, edge_kind: binding}
- {resource_type: google_compute_region_disk_resource_policy_attachment, attribute: disk, edge_kind: binding}
alternatives:
- {ref: ceph, difficulty: medium, compatibility: conceptual, notes: Ceph RBD with a CSI driver provides block volumes; data is copied at file or block level., approved_by: cloudowski}
- {ref: hetzner, difficulty: low, compatibility: conceptual, notes: Hetzner Cloud Volumes provide block storage with a CSI driver., approved_by: cloudowski}
- {ref: ovhcloud, difficulty: low, compatibility: conceptual, notes: OVHcloud Block Storage provides volumes with a Cinder CSI driver., approved_by: cloudowski}
- {ref: scaleway, difficulty: low, compatibility: conceptual, notes: Scaleway Block Storage provides volumes with a CSI driver., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/compute/docs/disks', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/compute_disk', 'https://cloud.google.com/kubernetes-engine/docs/how-to/persistent-volumes/gce-pd-csi-driver']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
