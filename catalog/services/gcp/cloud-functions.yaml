schema: '1.0'
kind: service
id: gcp.cloud-functions
provider: gcp
name: Cloud Run functions (Cloud Functions)
category: compute.serverless
resource_types:
  terraform: [google_cloudfunctions_function, google_cloudfunctions2_function, google_cloudfunctions_function_iam_binding, google_cloudfunctions_function_iam_member, google_cloudfunctions_function_iam_policy, google_cloudfunctions2_function_iam_binding, google_cloudfunctions2_function_iam_member, google_cloudfunctions2_function_iam_policy]
  kubernetes:
  - {group: cloudfunctions.cnrm.cloud.google.com, kind: CloudFunctionsFunction}
  ci_action: [google-github-actions/deploy-cloud-functions]
traits:
- {id: proprietary-runtime, level: medium, reason: 'Code is packaged for Google buildpacks and the Functions Framework signature, not a plain container.'}
- {id: proprietary-event-model, level: medium, reason: Event-triggered functions receive Google event payloads tied to Google sources.}
- {id: operational-tooling-coupling, level: low, reason: 'Deployment, scaling and secrets are configured through Google tooling.'}
rules:
- id: gcp.cloud-functions.event-trigger
  match:
    resource_type: [google_cloudfunctions_function, google_cloudfunctions2_function]
  when: {attr: event_trigger, exists: true}
  then: {add_trait: proprietary-event-model, level: medium, evidence: event_trigger}
sdk:
- ecosystem: npm
  packages: ['@google-cloud/functions-framework', '@google-cloud/functions']
  imports: ['[''"]@google-cloud/(functions-framework|functions)[''"/]']
- ecosystem: pypi
  packages: [functions-framework, google-cloud-functions]
  imports: [^\s*from\s+google\.cloud\s+import\s+.*\b(functions_v\w+|functions)\b, ^\s*(from|import)\s+google\.cloud\.(functions_v\w+|functions)\b, ^\s*(from|import)\s+functions_framework\b]
- ecosystem: go
  packages: [github.com/GoogleCloudPlatform/functions-framework-go, cloud.google.com/go/functions]
  imports: ['"cloud\.google\.com/go/(functions)(/[^"]*)?"', '"github\.com/GoogleCloudPlatform/functions-framework-go(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.google.cloud.functions:functions-framework-api', 'com.google.cloud:google-cloud-functions']
  imports: ['^\s*import\s+(static\s+)?com\.google\.(cloud\.functions)\b']
- ecosystem: nuget
  packages: [Google.Cloud.Functions.Framework, Google.Cloud.Functions.Hosting, Google.Cloud.Functions.V2]
  imports: ['^\s*using\s+(static\s+)?Google\.Cloud\.(Functions)\b']
edge_hints:
- {resource_type: google_cloudfunctions_function, attribute: event_trigger.resource, edge_kind: data-flow}
- {resource_type: google_cloudfunctions_function, attribute: source_archive_bucket, edge_kind: reference}
- {resource_type: google_cloudfunctions_function, attribute: vpc_connector, edge_kind: containment}
- {resource_type: google_cloudfunctions2_function, attribute: event_trigger.pubsub_topic, edge_kind: data-flow}
- {resource_type: google_cloudfunctions2_function, attribute: build_config.source.storage_source.bucket, edge_kind: reference}
- {resource_type: google_cloudfunctions2_function, attribute: service_config.vpc_connector, edge_kind: containment}
alternatives:
- {ref: openfaas, difficulty: medium, compatibility: conceptual, notes: Functions repackaged with OpenFaaS templates; event triggers need connectors., approved_by: cloudowski}
- {ref: knative, difficulty: medium, compatibility: conceptual, notes: Functions Framework apps can be built as containers and run on Knative Serving with Eventing triggers., approved_by: cloudowski}
- {ref: scaleway, difficulty: medium, compatibility: conceptual, notes: Scaleway Serverless Functions run similar runtimes; triggers and handler signatures differ., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/functions/docs', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/cloudfunctions2_function', 'https://github.com/GoogleCloudPlatform/functions-framework']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
