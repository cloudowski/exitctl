schema: '1.0'
kind: service
id: gcp.cloud-build
provider: gcp
name: Cloud Build
category: devops.ci
resource_types:
  terraform: [google_cloudbuild_trigger, google_cloudbuild_worker_pool, google_cloudbuild_bitbucket_server_config, google_cloudbuildv2_connection, google_cloudbuildv2_repository, google_cloudbuildv2_connection_iam_binding, google_cloudbuildv2_connection_iam_member, google_cloudbuildv2_connection_iam_policy]
  kubernetes:
  - {group: cloudbuild.cnrm.cloud.google.com, kind: CloudBuildTrigger}
  - {group: cloudbuild.cnrm.cloud.google.com, kind: CloudBuildWorkerPool}
traits:
- {id: proprietary-workflow-definition, level: medium, reason: Pipelines are defined in cloudbuild.yaml with Google builder images and substitutions.}
- {id: operational-tooling-coupling, level: low, reason: 'Triggers, worker pools and secrets integrate with Google IAM and Secret Manager.'}
sdk:
- ecosystem: npm
  packages: ['@google-cloud/cloudbuild']
  imports: ['[''"]@google-cloud/(cloudbuild)[''"/]']
- ecosystem: pypi
  packages: [google-cloud-build]
  imports: [^\s*from\s+google\.cloud\.devtools\s+import\s+.*\bcloudbuild\w*, ^\s*(from|import)\s+google\.cloud\.devtools\.cloudbuild\w*]
- ecosystem: go
  packages: [cloud.google.com/go/cloudbuild]
  imports: ['"cloud\.google\.com/go/(cloudbuild)(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.google.cloud:google-cloud-build']
  imports: ['^\s*import\s+(static\s+)?com\.google\.(cloud\.devtools\.cloudbuild)\b']
- ecosystem: nuget
  packages: [Google.Cloud.CloudBuild.V1, Google.Cloud.CloudBuild.V2]
  imports: ['^\s*using\s+(static\s+)?Google\.Cloud\.(CloudBuild)\b']
edge_hints:
- {resource_type: google_cloudbuild_trigger, attribute: service_account, edge_kind: reference}
- {resource_type: google_cloudbuild_trigger, attribute: repository_event_config.repository, edge_kind: reference}
- {resource_type: google_cloudbuildv2_repository, attribute: parent_connection, edge_kind: containment}
alternatives:
- {ref: woodpecker, difficulty: medium, compatibility: conceptual, notes: Container-based pipeline steps map closely to Cloud Build steps; YAML is rewritten., approved_by: cloudowski}
- {ref: forgejo, difficulty: medium, compatibility: conceptual, notes: Forgejo Actions runs GitHub Actions-style workflows; steps are rewritten., approved_by: cloudowski}
- {ref: gitea, difficulty: medium, compatibility: conceptual, notes: Gitea Actions runs GitHub Actions-style workflows; steps are rewritten., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/build/docs', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/cloudbuild_trigger']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
