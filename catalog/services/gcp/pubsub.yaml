schema: '1.0'
kind: service
id: gcp.pubsub
provider: gcp
name: Pub/Sub
category: messaging.pubsub
resource_types:
  terraform: [google_pubsub_topic, google_pubsub_subscription, google_pubsub_schema, google_pubsub_topic_iam_binding, google_pubsub_topic_iam_member, google_pubsub_topic_iam_policy, google_pubsub_subscription_iam_binding, google_pubsub_subscription_iam_member, google_pubsub_subscription_iam_policy, google_pubsub_schema_iam_binding, google_pubsub_schema_iam_member, google_pubsub_schema_iam_policy, google_pubsub_lite_topic, google_pubsub_lite_subscription, google_pubsub_lite_reservation]
  kubernetes:
  - {group: pubsub.cnrm.cloud.google.com, kind: PubSubTopic}
  - {group: pubsub.cnrm.cloud.google.com, kind: PubSubSubscription}
  - {group: pubsub.cnrm.cloud.google.com, kind: PubSubSchema}
  - {group: pubsub.cnrm.cloud.google.com, kind: PubSubLiteReservation}
traits:
- {id: proprietary-api, level: medium, reason: 'Pub/Sub has its own publish/pull/push API; no OSS broker implements it, though concepts map to Kafka or NATS.'}
- {id: proprietary-event-model}
- {id: proprietary-sdk}
rules:
- id: gcp.pubsub.push-subscription
  match:
    resource_type: [google_pubsub_subscription]
  when: {attr: push_config.push_endpoint, exists: true}
  then: {add_trait: proprietary-event-model, level: medium, evidence: push_config}
- id: gcp.pubsub.bigquery-export
  match:
    resource_type: [google_pubsub_subscription]
  when: {attr: bigquery_config.table, exists: true}
  then: {add_trait: managed-only-feature, level: medium, evidence: bigquery_config}
sdk:
- ecosystem: npm
  packages: ['@google-cloud/pubsub']
  imports: ['[''"]@google-cloud/(pubsub)[''"/]']
- ecosystem: pypi
  packages: [google-cloud-pubsub, google-cloud-pubsublite]
  imports: [^\s*from\s+google\.cloud\s+import\s+.*\b(pubsub|pubsub_v1|pubsublite)\b, ^\s*(from|import)\s+google\.cloud\.(pubsub|pubsub_v1|pubsublite)\b]
- ecosystem: go
  packages: [cloud.google.com/go/pubsub, cloud.google.com/go/pubsub/*, cloud.google.com/go/pubsublite]
  imports: ['"cloud\.google\.com/go/(pubsub|pubsublite)(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.google.cloud:google-cloud-pubsub', 'com.google.cloud:google-cloud-pubsublite']
  imports: ['^\s*import\s+(static\s+)?com\.google\.(cloud\.pubsub|pubsub\.v1|cloud\.pubsublite)\b']
- ecosystem: nuget
  packages: [Google.Cloud.PubSub.V1]
  imports: ['^\s*using\s+(static\s+)?Google\.Cloud\.(PubSub)\b']
edge_hints:
- {resource_type: google_pubsub_subscription, attribute: topic, edge_kind: data-flow}
- {resource_type: google_pubsub_subscription, attribute: dead_letter_policy.dead_letter_topic, edge_kind: data-flow}
- {resource_type: google_pubsub_subscription, attribute: bigquery_config.table, edge_kind: data-flow}
- {resource_type: google_pubsub_subscription, attribute: cloud_storage_config.bucket, edge_kind: data-flow}
- {resource_type: google_pubsub_topic, attribute: schema_settings.schema, edge_kind: reference}
- {resource_type: google_pubsub_lite_subscription, attribute: topic, edge_kind: data-flow}
alternatives:
- {ref: apache-kafka, difficulty: medium, compatibility: conceptual, notes: 'Topics and subscriptions map to topics and consumer groups; ack deadlines, push delivery and filters need redesign.', approved_by: cloudowski}
- {ref: nats, difficulty: medium, compatibility: conceptual, notes: NATS JetStream streams and durable consumers cover pull and fan-out; producer and consumer code must be rewritten., approved_by: cloudowski}
- {ref: rabbitmq, difficulty: medium, compatibility: conceptual, notes: Fanout exchanges and queues model topics and subscriptions; ordering keys and replay work differently., approved_by: cloudowski}
- {ref: apache-pulsar, difficulty: medium, compatibility: conceptual, notes: Pulsar topics with shared or key-shared subscriptions are close to the Pub/Sub model; client code must change., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/pubsub/docs/overview', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/pubsub_topic', 'https://cloud.google.com/config-connector/docs/reference/resource-docs/pubsub/pubsubtopic']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
