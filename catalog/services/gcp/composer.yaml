schema: '1.0'
kind: service
id: gcp.composer
provider: gcp
name: Cloud Composer
category: integration
resource_types:
  terraform: [google_composer_environment, google_composer_user_workloads_secret, google_composer_user_workloads_config_map]
  kubernetes:
  - {group: composer.cnrm.cloud.google.com, kind: ComposerEnvironment}
traits:
- {id: operational-tooling-coupling, level: low, reason: DAGs are standard Apache Airflow; environment management and Google operators are Composer-specific.}
- {id: managed-only-feature, level: low, reason: 'Environment scaling, DAG storage in a Composer bucket and upgrades are handled by Google.'}
edge_hints:
- {resource_type: google_composer_environment, attribute: config.node_config.network, edge_kind: containment}
- {resource_type: google_composer_environment, attribute: config.node_config.subnetwork, edge_kind: containment}
alternatives:
- {ref: apache-airflow, difficulty: low, compatibility: api-compatible, notes: Same Airflow DAGs; replace Composer-specific settings and check use of Google provider operators., approved_by: cloudowski}
- {ref: argo-workflows, difficulty: high, compatibility: conceptual, notes: Container-native workflows on Kubernetes; DAGs must be rewritten as Argo templates., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/composer/docs', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/composer_environment']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
