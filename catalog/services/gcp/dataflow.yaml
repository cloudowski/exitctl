schema: '1.0'
kind: service
id: gcp.dataflow
provider: gcp
name: Dataflow
category: analytics
resource_types:
  terraform: [google_dataflow_job, google_dataflow_flex_template_job]
  kubernetes:
  - {group: dataflow.cnrm.cloud.google.com, kind: DataflowJob}
  - {group: dataflow.cnrm.cloud.google.com, kind: DataflowFlexTemplateJob}
traits:
- {id: proprietary-runtime, level: low, reason: 'Pipelines use Apache Beam, which also runs on Flink and Spark runners.'}
- {id: managed-only-feature, level: medium, reason: 'Streaming Engine, Dataflow Shuffle, autoscaling and Google templates are Dataflow-only.'}
- {id: operational-tooling-coupling, level: medium, reason: 'Job monitoring, updates and templates are managed with Dataflow tooling.'}
sdk:
- ecosystem: pypi
  packages: [google-cloud-dataflow-client]
  imports: [^\s*from\s+google\.cloud\s+import\s+.*\b(dataflow\w*)\b, ^\s*(from|import)\s+google\.cloud\.(dataflow\w*)\b]
  usage: [\bDataflowRunner\b, 'runner\s*=\s*[''\"]DataflowRunner']
  gate: [apache-beam]
- ecosystem: go
  packages: [cloud.google.com/go/dataflow]
  imports: ['"cloud\.google\.com/go/(dataflow)(/[^"]*)?"']
- ecosystem: maven
  packages: ['org.apache.beam:beam-runners-google-cloud-dataflow-java', 'com.google.cloud:google-cloud-dataflow']
  imports: ['^\s*import\s+(static\s+)?com\.google\.(cloud\.dataflow)\b', '^\s*import\s+(static\s+)?org\.apache\.beam\.runners\.dataflow\b']
- ecosystem: nuget
  packages: [Google.Cloud.Dataflow.V1Beta3]
  imports: ['^\s*using\s+(static\s+)?Google\.Cloud\.(Dataflow)\b']
edge_hints:
- {resource_type: google_dataflow_job, attribute: temp_gcs_location, edge_kind: reference}
- {resource_type: google_dataflow_job, attribute: network, edge_kind: containment}
- {resource_type: google_dataflow_job, attribute: subnetwork, edge_kind: containment}
- {resource_type: google_dataflow_flex_template_job, attribute: container_spec_gcs_path, edge_kind: reference}
- {resource_type: google_dataflow_flex_template_job, attribute: subnetwork, edge_kind: containment}
alternatives:
- {ref: apache-flink, difficulty: medium, compatibility: api-compatible, notes: Beam pipelines run on the Flink runner; Dataflow templates and service options need replacement., approved_by: cloudowski}
- {ref: apache-spark, difficulty: medium, compatibility: conceptual, notes: Beam has a Spark runner; native Spark jobs need a rewrite of pipeline code., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/dataflow/docs', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/dataflow_flex_template_job', 'https://beam.apache.org/documentation/runners/capability-matrix/']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
