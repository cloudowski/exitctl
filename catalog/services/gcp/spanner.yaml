schema: '1.0'
kind: service
id: gcp.spanner
provider: gcp
name: Cloud Spanner
category: database.relational
resource_types:
  terraform: [google_spanner_instance, google_spanner_database, google_spanner_instance_config, google_spanner_instance_partition, google_spanner_backup_schedule, google_spanner_instance_iam_binding, google_spanner_instance_iam_member, google_spanner_instance_iam_policy, google_spanner_database_iam_binding, google_spanner_database_iam_member, google_spanner_database_iam_policy]
  kubernetes:
  - {group: spanner.cnrm.cloud.google.com, kind: SpannerInstance}
  - {group: spanner.cnrm.cloud.google.com, kind: SpannerDatabase}
traits:
- {id: proprietary-data-model, level: high, reason: 'Interleaved tables, commit timestamps and split-based distribution are Spanner-specific schema concepts.'}
- {id: proprietary-query-language, level: high, reason: The default GoogleSQL dialect and its DDL differ from other SQL engines; the PostgreSQL dialect is a subset.}
- {id: managed-only-feature, level: medium, reason: TrueTime-based external consistency and multi-region configurations exist only as a managed service.}
- {id: data-gravity}
- {id: proprietary-sdk}
rules:
- id: gcp.spanner.postgresql-dialect
  match:
    resource_type: [google_spanner_database]
  when: {attr: database_dialect, equals: POSTGRESQL}
  then:
    set_level: {trait: proprietary-query-language, level: medium}
    evidence: database_dialect
sdk:
- ecosystem: npm
  packages: ['@google-cloud/spanner']
  imports: ['[''"]@google-cloud/(spanner)[''"/]']
- ecosystem: pypi
  packages: [google-cloud-spanner, sqlalchemy-spanner, django-google-spanner]
  imports: [^\s*from\s+google\.cloud\s+import\s+.*\b(spanner\w*)\b, ^\s*(from|import)\s+google\.cloud\.(spanner\w*)\b]
- ecosystem: go
  packages: [cloud.google.com/go/spanner, github.com/googleapis/go-sql-spanner]
  imports: ['"cloud\.google\.com/go/(spanner)(/[^"]*)?"', '"github\.com/googleapis/go-sql-spanner"']
- ecosystem: maven
  packages: ['com.google.cloud:google-cloud-spanner', 'com.google.cloud:google-cloud-spanner-jdbc', 'com.google.cloud:google-cloud-spanner-hibernate-dialect']
  imports: ['^\s*import\s+(static\s+)?com\.google\.(cloud\.spanner|spanner\.)\b']
- ecosystem: nuget
  packages: [Google.Cloud.Spanner.Data, Google.Cloud.Spanner.V1, Google.Cloud.Spanner.Admin.*]
  imports: ['^\s*using\s+(static\s+)?Google\.Cloud\.(Spanner)\b']
edge_hints:
- {resource_type: google_spanner_database, attribute: instance, edge_kind: containment}
- {resource_type: google_spanner_instance_partition, attribute: instance, edge_kind: containment}
- {resource_type: google_spanner_backup_schedule, attribute: database, edge_kind: containment}
alternatives:
- {ref: cockroachdb, difficulty: high, compatibility: conceptual, notes: 'Distributed SQL with serializable transactions; schema, interleaving and GoogleSQL queries need conversion.', approved_by: cloudowski}
- {ref: yugabytedb, difficulty: high, compatibility: conceptual, notes: Distributed PostgreSQL-compatible SQL; closest fit for databases using the Spanner PostgreSQL dialect., approved_by: cloudowski}
- {ref: postgresql, difficulty: high, compatibility: conceptual, notes: Fits when horizontal write scale is not required; GoogleSQL queries and schema need rewriting., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/spanner/docs', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/spanner_database', 'https://cloud.google.com/spanner/docs/postgresql-interface']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
