schema: '1.0'
kind: service
id: gcp.secret-manager
provider: gcp
name: Secret Manager
category: security.secrets
resource_types:
  terraform: [google_secret_manager_secret, google_secret_manager_secret_version, google_secret_manager_secret_iam_binding, google_secret_manager_secret_iam_member, google_secret_manager_secret_iam_policy, google_secret_manager_regional_secret, google_secret_manager_regional_secret_version, google_secret_manager_regional_secret_iam_binding, google_secret_manager_regional_secret_iam_member, google_secret_manager_regional_secret_iam_policy]
  kubernetes:
  - {group: secretmanager.cnrm.cloud.google.com, kind: SecretManagerSecret}
  - {group: secretmanager.cnrm.cloud.google.com, kind: SecretManagerSecretVersion}
traits:
- {id: proprietary-api, level: low, reason: Secrets are opaque values behind a simple versioned API; access is controlled by Google IAM.}
- {id: proprietary-sdk}
sdk:
- ecosystem: npm
  packages: ['@google-cloud/secret-manager']
  imports: ['[''"]@google-cloud/(secret-manager)[''"/]']
- ecosystem: pypi
  packages: [google-cloud-secret-manager]
  imports: [^\s*from\s+google\.cloud\s+import\s+.*\b(secretmanager\w*)\b, ^\s*(from|import)\s+google\.cloud\.(secretmanager\w*)\b]
- ecosystem: go
  packages: [cloud.google.com/go/secretmanager]
  imports: ['"cloud\.google\.com/go/(secretmanager)(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.google.cloud:google-cloud-secretmanager']
  imports: ['^\s*import\s+(static\s+)?com\.google\.(cloud\.secretmanager)\b']
- ecosystem: nuget
  packages: [Google.Cloud.SecretManager.V1]
  imports: ['^\s*using\s+(static\s+)?Google\.Cloud\.(SecretManager)\b']
kubernetes_bindings:
- match:
    kind: SecretProviderClass
    group: secrets-store.csi.x-k8s.io
    field: spec.provider
    in: [gcp, gke]
- match: {kind: SecretStore, group: external-secrets.io, field: spec.provider.gcpsm, exists: true}
- match: {kind: ClusterSecretStore, group: external-secrets.io, field: spec.provider.gcpsm, exists: true}
edge_hints:
- {resource_type: google_secret_manager_secret_version, attribute: secret, edge_kind: containment}
- {resource_type: google_secret_manager_regional_secret_version, attribute: secret, edge_kind: containment}
- {resource_type: google_secret_manager_secret, attribute: topics.name, edge_kind: data-flow}
alternatives:
- {ref: vault-openbao, difficulty: medium, compatibility: conceptual, notes: KV secrets engine with versioning; replace SDK calls and IAM bindings with Vault policies., approved_by: cloudowski}
- {ref: sops, difficulty: low, compatibility: conceptual, notes: 'Encrypted secrets in Git; suits static configuration secrets, not runtime secret APIs.', approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/secret-manager/docs', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/secret_manager_secret', 'https://cloud.google.com/secret-manager/docs/secret-manager-managed-csi-component']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
