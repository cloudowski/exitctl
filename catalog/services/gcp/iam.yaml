schema: '1.0'
kind: service
id: gcp.iam
provider: gcp
name: Identity and Access Management (IAM)
category: identity.iam
resource_types:
  terraform: [google_service_account, google_service_account_key, google_service_account_iam_binding, google_service_account_iam_member, google_service_account_iam_policy, google_project_iam_binding, google_project_iam_member, google_project_iam_policy, google_project_iam_custom_role, google_project_iam_audit_config, google_project_iam_member_remove, google_folder_iam_binding, google_folder_iam_member, google_folder_iam_policy, google_folder_iam_audit_config, google_organization_iam_binding, google_organization_iam_member, google_organization_iam_policy, google_organization_iam_custom_role, google_organization_iam_audit_config, google_iam_workload_identity_pool, google_iam_workload_identity_pool_provider, google_iam_workforce_pool, google_iam_workforce_pool_provider, google_iam_deny_policy, google_iam_access_boundary_policy, google_iam_principal_access_boundary_policy, google_project_service_identity]
  kubernetes:
  - {group: iam.cnrm.cloud.google.com, kind: IAMServiceAccount}
  - {group: iam.cnrm.cloud.google.com, kind: IAMServiceAccountKey}
  - {group: iam.cnrm.cloud.google.com, kind: IAMPolicy}
  - {group: iam.cnrm.cloud.google.com, kind: IAMPolicyMember}
  - {group: iam.cnrm.cloud.google.com, kind: IAMPartialPolicy}
  - {group: iam.cnrm.cloud.google.com, kind: IAMCustomRole}
  - {group: iam.cnrm.cloud.google.com, kind: IAMAuditConfig}
  - {group: iam.cnrm.cloud.google.com, kind: IAMWorkloadIdentityPool}
  - {group: iam.cnrm.cloud.google.com, kind: IAMWorkloadIdentityPoolProvider}
  - {group: iam.cnrm.cloud.google.com, kind: IAMWorkforcePool}
  - {group: iam.cnrm.cloud.google.com, kind: IAMWorkforcePoolProvider}
  - {group: iam.cnrm.cloud.google.com, kind: IAMAccessBoundaryPolicy}
  - {group: iam.cnrm.cloud.google.com, kind: IAMDenyPolicy}
  ci_action: [google-github-actions/auth]
traits:
- {id: proprietary-iam-model, level: medium, reason: Access is expressed as Google IAM roles bound to service accounts and principals on the resource hierarchy.}
- {id: skills-specialization, level: low, reason: IAM concepts are common across clouds but role names and hierarchy are Google-specific.}
rules:
- id: gcp.iam.ci-auth
  match:
    resource_type: [ci_action]
  when: {attr: action, equals: google-github-actions/auth}
  then: {add_trait: provider-ci-auth, level: low}
- id: gcp.iam.workload-identity-federation
  match:
    resource_type: [google_iam_workload_identity_pool_provider]
  then: {add_trait: provider-ci-auth, level: low, evidence: oidc}
- id: gcp.iam.service-account-key
  match:
    resource_type: [google_service_account_key]
  then: {add_trait: proprietary-iam-model, level: medium, evidence: service_account_id}
sdk:
- ecosystem: npm
  packages: ['@google-cloud/iam', '@google-cloud/iam-credentials']
  imports: ['[''"]@google-cloud/(iam|iam-credentials)[''"/]']
- ecosystem: pypi
  packages: [google-cloud-iam]
  imports: [^\s*from\s+google\.cloud\s+import\s+.*\b(iam_credentials\w*|iam_admin\w*|iam_v\w+)\b, ^\s*(from|import)\s+google\.cloud\.(iam_credentials\w*|iam_admin\w*|iam_v\w+)\b]
- ecosystem: go
  imports: ['"cloud\.google\.com/go/(iam/(admin|credentials)/apiv\w+)(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.google.cloud:google-cloud-iamcredentials', 'com.google.cloud:google-cloud-iam-admin']
  imports: ['^\s*import\s+(static\s+)?com\.google\.(cloud\.iam\.(credentials|admin))\b']
- ecosystem: nuget
  packages: [Google.Cloud.Iam.Credentials.V1, Google.Cloud.Iam.Admin.V1]
  imports: ['^\s*using\s+(static\s+)?Google\.Cloud\.(Iam\.(Credentials|Admin))\b']
kubernetes_bindings:
- match: {kind: ServiceAccount, annotation: iam.gke.io/gcp-service-account, exists: true}
edge_hints:
- {resource_type: google_service_account_key, attribute: service_account_id, edge_kind: containment}
- {resource_type: google_service_account_iam_member, attribute: service_account_id, edge_kind: binding}
- {resource_type: google_service_account_iam_binding, attribute: service_account_id, edge_kind: binding}
- {resource_type: google_service_account_iam_policy, attribute: service_account_id, edge_kind: binding}
- {resource_type: google_iam_workload_identity_pool_provider, attribute: workload_identity_pool_id, edge_kind: containment}
- {resource_type: google_iam_workforce_pool_provider, attribute: workforce_pool_id, edge_kind: containment}
alternatives:
- {ref: keycloak, difficulty: high, compatibility: conceptual, notes: Keycloak provides identities and OIDC tokens; resource permissions must be redone in each target system., approved_by: cloudowski}
- {ref: vault-openbao, difficulty: medium, compatibility: conceptual, notes: Vault/OpenBao issues short-lived credentials and secrets; replaces service account keys and token exchange., approved_by: cloudowski}
- {ref: zitadel, difficulty: high, compatibility: conceptual, notes: ZITADEL provides identities and OIDC; cloud resource authorization must be redesigned., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/iam/docs/overview', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/google_project_iam', 'https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
