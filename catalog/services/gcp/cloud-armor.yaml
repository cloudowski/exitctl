schema: '1.0'
kind: service
id: gcp.cloud-armor
provider: gcp
name: Cloud Armor
category: network
resource_types:
  terraform: [google_compute_security_policy, google_compute_region_security_policy, google_compute_region_security_policy_rule, google_compute_security_policy_rule]
  kubernetes:
  - {group: compute.cnrm.cloud.google.com, kind: ComputeSecurityPolicy}
traits:
- {id: proprietary-api, level: medium, reason: WAF and rate-limit rules use the Cloud Armor rule language and preconfigured rule sets.}
- {id: managed-only-feature, level: medium, reason: Edge DDoS protection and Adaptive Protection run only on Google load balancers.}
alternatives:
- {ref: nginx, difficulty: medium, compatibility: conceptual, notes: NGINX with ModSecurity and OWASP CRS covers WAF rules; edge DDoS protection is not included., approved_by: cloudowski}
- {ref: haproxy, difficulty: medium, compatibility: conceptual, notes: HAProxy stick tables and ACLs cover rate limiting and filtering; WAF rules need translation., approved_by: cloudowski}
- {ref: envoy, difficulty: medium, compatibility: conceptual, notes: 'Envoy filters (RBAC, rate limit, ext_authz) cover parts of the rule set; WAF needs an extension.', approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://cloud.google.com/armor/docs', 'https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/compute_security_policy']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
