schema: '1.0'
kind: service
id: aws.bedrock
provider: aws
name: Amazon Bedrock
category: ai-ml
resource_types:
  terraform: [aws_bedrock_custom_model, aws_bedrock_provisioned_model_throughput, aws_bedrock_model_invocation_logging_configuration, aws_bedrock_guardrail, aws_bedrock_guardrail_version, aws_bedrock_inference_profile, aws_bedrockagent_agent, aws_bedrockagent_agent_action_group, aws_bedrockagent_agent_alias, aws_bedrockagent_agent_collaborator, aws_bedrockagent_agent_knowledge_base_association, aws_bedrockagent_knowledge_base, aws_bedrockagent_data_source, aws_bedrockagent_flow, aws_bedrockagent_prompt]
  cloudformation: ['AWS::Bedrock::Agent', 'AWS::Bedrock::AgentAlias', 'AWS::Bedrock::KnowledgeBase', 'AWS::Bedrock::DataSource', 'AWS::Bedrock::Guardrail', 'AWS::Bedrock::GuardrailVersion', 'AWS::Bedrock::Flow', 'AWS::Bedrock::FlowAlias', 'AWS::Bedrock::FlowVersion', 'AWS::Bedrock::Prompt', 'AWS::Bedrock::PromptVersion', 'AWS::Bedrock::ApplicationInferenceProfile']
traits:
- {id: proprietary-api, level: medium, reason: 'InvokeModel and Converse APIs differ from the de facto OpenAI-compatible API; model weights of hosted proprietary models are not portable.'}
- {id: managed-only-feature, level: high, reason: 'Hosted foundation models such as Claude and Nova have no downloadable weights; only open-weight models can be run elsewhere.'}
- {id: proprietary-sdk}
rules:
- id: aws.bedrock.agents
  match:
    resource_type: [aws_bedrockagent_agent, aws_bedrockagent_flow]
  then: {add_trait: proprietary-workflow-definition, level: medium, evidence: instruction}
- id: aws.bedrock.knowledge-base
  match:
    resource_type: [aws_bedrockagent_knowledge_base]
  then: {add_trait: managed-only-feature, level: medium, evidence: storage_configuration}
- id: aws.bedrock.custom-model
  match:
    resource_type: [aws_bedrock_custom_model]
  then: {add_trait: non-exportable-data, level: high, evidence: base_model_identifier}
- id: aws.bedrock.guardrail
  match:
    resource_type: [aws_bedrock_guardrail]
  then: {add_trait: managed-only-feature, level: low, evidence: name}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-bedrock', '@aws-sdk/client-bedrock-runtime', '@aws-sdk/client-bedrock-agent', '@aws-sdk/client-bedrock-agent-runtime', '@ai-sdk/amazon-bedrock', '@langchain/aws']
  imports: ['[''"]@aws-sdk/client-bedrock(-runtime|-agent|-agent-runtime)?[''"/]', '[''"]@ai-sdk/amazon-bedrock[''"]', '[''"]@langchain/aws[''"/]']
- ecosystem: pypi
  packages: [langchain-aws, llama-index-llms-bedrock, llama-index-llms-bedrock-converse]
  imports: ['^\s*(from|import)\s+langchain_aws\b', '^\s*from\s+llama_index\.llms\.bedrock']
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["''](bedrock|bedrock-runtime|bedrock-agent|bedrock-agent-runtime)["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/bedrock, github.com/aws/aws-sdk-go-v2/service/bedrockruntime, github.com/aws/aws-sdk-go-v2/service/bedrockagent, github.com/aws/aws-sdk-go-v2/service/bedrockagentruntime]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/(bedrock|bedrockruntime|bedrockagent|bedrockagentruntime)(/[^"]*)?"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:bedrock', 'software.amazon.awssdk:bedrockruntime', 'software.amazon.awssdk:bedrockagent', 'software.amazon.awssdk:bedrockagentruntime']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.(bedrock|bedrockruntime|bedrockagent|bedrockagentruntime)\.']
- ecosystem: nuget
  packages: [AWSSDK.Bedrock, AWSSDK.BedrockRuntime, AWSSDK.BedrockAgent, AWSSDK.BedrockAgentRuntime]
  imports: ['^\s*using\s+(static\s+)?Amazon\.(Bedrock|BedrockRuntime|BedrockAgent|BedrockAgentRuntime)\b']
- ecosystem: rubygems
  packages: [aws-sdk-bedrock, aws-sdk-bedrockruntime, aws-sdk-bedrockagent, aws-sdk-bedrockagentruntime]
  imports: ['^\s*require\s+["'']aws-sdk-(bedrock|bedrockruntime|bedrockagent|bedrockagentruntime)["'']']
  usage: ['(?i)\bAws::(bedrock|bedrockruntime|bedrockagent|bedrockagentruntime)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-bedrock, aws-sdk-bedrockruntime, aws-sdk-bedrockagent, aws-sdk-bedrockagentruntime]
  imports: ['\baws_sdk_(bedrock|bedrockruntime|bedrockagent|bedrockagentruntime)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(bedrock|bedrockruntime|bedrockagent|bedrockagentruntime)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_bedrockagent_agent, attribute: agent_resource_role_arn, edge_kind: binding}
- {resource_type: aws_bedrockagent_agent_action_group, attribute: agent_id, edge_kind: containment}
- {resource_type: aws_bedrockagent_agent_action_group, attribute: action_group_executor.lambda, edge_kind: data-flow}
- {resource_type: aws_bedrockagent_agent_alias, attribute: agent_id, edge_kind: containment}
- {resource_type: aws_bedrockagent_knowledge_base, attribute: role_arn, edge_kind: binding}
- {resource_type: aws_bedrockagent_knowledge_base, attribute: storage_configuration.opensearch_serverless_configuration.collection_arn, edge_kind: data-flow}
- {resource_type: aws_bedrockagent_data_source, attribute: knowledge_base_id, edge_kind: containment}
- {resource_type: aws_bedrockagent_data_source, attribute: data_source_configuration.s3_configuration.bucket_arn, edge_kind: data-flow}
- {resource_type: aws_bedrockagent_agent_knowledge_base_association, attribute: knowledge_base_id, edge_kind: binding}
- {resource_type: aws_bedrock_model_invocation_logging_configuration, attribute: logging_config.s3_config.bucket_name, edge_kind: data-flow}
alternatives:
- {ref: vllm, difficulty: medium, compatibility: conceptual, notes: 'vLLM serves open-weight models with an OpenAI-compatible API; proprietary hosted models must be swapped for open ones.', approved_by: cloudowski}
- {ref: ollama, difficulty: medium, compatibility: conceptual, notes: Ollama runs open-weight models locally or on a server; suited to smaller deployments., approved_by: cloudowski}
- {ref: scaleway, difficulty: medium, compatibility: conceptual, notes: Scaleway Generative APIs serve open-weight models through an OpenAI-compatible API hosted in Europe., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/bedrockagent_agent']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
