schema: '1.0'
kind: service
id: aws.redshift
provider: aws
name: Amazon Redshift
category: analytics
resource_types:
  terraform: [aws_redshift_cluster, aws_redshift_cluster_iam_roles, aws_redshift_cluster_snapshot, aws_redshift_parameter_group, aws_redshift_subnet_group, aws_redshift_snapshot_schedule, aws_redshift_snapshot_schedule_association, aws_redshift_snapshot_copy_grant, aws_redshift_snapshot_copy, aws_redshift_event_subscription, aws_redshift_scheduled_action, aws_redshift_usage_limit, aws_redshift_endpoint_access, aws_redshift_endpoint_authorization, aws_redshift_partner, aws_redshift_hsm_client_certificate, aws_redshift_hsm_configuration, aws_redshift_authentication_profile, aws_redshift_resource_policy, aws_redshift_data_share_authorization, aws_redshift_data_share_consumer_association, aws_redshift_logging, aws_redshift_integration, aws_redshiftserverless_namespace, aws_redshiftserverless_workgroup, aws_redshiftserverless_endpoint_access, aws_redshiftserverless_snapshot, aws_redshiftserverless_usage_limit, aws_redshiftserverless_resource_policy, aws_redshiftserverless_custom_domain_association, aws_redshiftdata_statement]
  cloudformation: ['AWS::Redshift::Cluster', 'AWS::Redshift::ClusterParameterGroup', 'AWS::Redshift::ClusterSubnetGroup', 'AWS::Redshift::ClusterSecurityGroup', 'AWS::Redshift::ClusterSecurityGroupIngress', 'AWS::Redshift::EndpointAccess', 'AWS::Redshift::EndpointAuthorization', 'AWS::Redshift::EventSubscription', 'AWS::Redshift::ScheduledAction', 'AWS::Redshift::Integration', 'AWS::RedshiftServerless::Namespace', 'AWS::RedshiftServerless::Workgroup']
traits:
- {id: proprietary-query-language, level: medium, reason: 'SQL dialect derived from PostgreSQL 8 with Redshift-specific DDL (DISTKEY, SORTKEY), SUPER type, COPY and UNLOAD.'}
- {id: data-gravity, level: high, reason: 'Warehouse data is stored in a managed internal format; leaving requires UNLOAD to S3 and reload elsewhere.'}
- {id: skills-specialization, level: medium, reason: Tuning distribution styles and workload management is Redshift-specific.}
rules:
- id: aws.redshift.data-sharing
  match:
    resource_type: [aws_redshift_data_share_authorization, aws_redshift_data_share_consumer_association]
  then: {add_trait: managed-only-feature, level: medium, evidence: data_share_arn}
- id: aws.redshift.zero-etl
  match:
    resource_type: [aws_redshift_integration]
  then: {add_trait: managed-change-stream, level: medium, evidence: source_arn}
- id: aws.redshift.serverless
  match:
    resource_type: [aws_redshiftserverless_workgroup]
  then: {add_trait: managed-only-feature, level: low, evidence: base_capacity}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-redshift', '@aws-sdk/client-redshift-data', '@aws-sdk/client-redshift-serverless']
  imports: ['[''"]@aws-sdk/client-redshift(-data|-serverless)?[''"/]']
  usage: ['\bAWS\.(Redshift|RedshiftData)\b']
  gate: [aws-sdk]
- ecosystem: pypi
  packages: [redshift-connector, sqlalchemy-redshift]
  imports: ['^\s*(from|import)\s+(redshift_connector|sqlalchemy_redshift)\b']
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["''](redshift|redshift-data|redshift-serverless)["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/redshift, github.com/aws/aws-sdk-go-v2/service/redshiftdata, github.com/aws/aws-sdk-go-v2/service/redshiftserverless]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/(redshift|redshiftdata|redshiftserverless|redshiftdataapiservice)(/[^"]*)?"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:redshift', 'software.amazon.awssdk:redshiftdata', 'software.amazon.awssdk:redshiftserverless', 'com.amazon.redshift:redshift-jdbc42']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.(redshift|redshiftdata|redshiftserverless)\.', '^\s*import\s+(static\s+)?com\.amazon\.redshift\.']
- ecosystem: nuget
  packages: [AWSSDK.Redshift, AWSSDK.RedshiftDataAPIService, AWSSDK.RedshiftServerless]
  imports: ['^\s*using\s+(static\s+)?Amazon\.(Redshift|RedshiftDataAPIService|RedshiftServerless)\b']
- ecosystem: rubygems
  packages: [aws-sdk-redshift, aws-sdk-redshiftdata, aws-sdk-redshiftserverless]
  imports: ['^\s*require\s+["'']aws-sdk-(redshift|redshiftdata|redshiftserverless)["'']']
  usage: ['(?i)\bAws::(redshift|redshiftdata|redshiftserverless)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-redshift, aws-sdk-redshiftdata, aws-sdk-redshiftserverless]
  imports: ['\baws_sdk_(redshift|redshiftdata|redshiftserverless)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(redshift|redshiftdata|redshiftserverless)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_redshift_cluster, attribute: cluster_subnet_group_name, edge_kind: containment}
- {resource_type: aws_redshift_cluster, attribute: vpc_security_group_ids, edge_kind: containment}
- {resource_type: aws_redshift_cluster, attribute: iam_roles, edge_kind: binding}
- {resource_type: aws_redshift_cluster, attribute: kms_key_id, edge_kind: reference}
- {resource_type: aws_redshift_subnet_group, attribute: subnet_ids, edge_kind: containment}
- {resource_type: aws_redshift_cluster_iam_roles, attribute: cluster_identifier, edge_kind: binding}
- {resource_type: aws_redshiftserverless_workgroup, attribute: namespace_name, edge_kind: containment}
- {resource_type: aws_redshiftserverless_workgroup, attribute: subnet_ids, edge_kind: containment}
- {resource_type: aws_redshift_logging, attribute: bucket_name, edge_kind: data-flow}
alternatives:
- {ref: clickhouse, difficulty: high, compatibility: conceptual, notes: 'Columnar OLAP engine; tables, SQL dialect and loading pipelines are redesigned. Data moves via Parquet exports.', approved_by: cloudowski}
- {ref: trino, difficulty: high, compatibility: conceptual, notes: Trino over Iceberg or Hive tables on object storage replaces the warehouse; SQL and ETL jobs need porting., approved_by: cloudowski}
- {ref: postgresql, difficulty: high, compatibility: conceptual, notes: Suitable for smaller warehouses; Redshift-specific DDL and functions must be rewritten., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html', 'https://docs.aws.amazon.com/redshift/latest/dg/c_redshift-and-postgres-sql.html', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/redshift_cluster']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
