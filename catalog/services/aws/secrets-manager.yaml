schema: '1.0'
kind: service
id: aws.secrets-manager
provider: aws
name: AWS Secrets Manager
category: security.secrets
resource_types:
  terraform: [aws_secretsmanager_secret, aws_secretsmanager_secret_version, aws_secretsmanager_secret_policy, aws_secretsmanager_secret_rotation]
  cloudformation: ['AWS::SecretsManager::Secret', 'AWS::SecretsManager::SecretTargetAttachment', 'AWS::SecretsManager::RotationSchedule', 'AWS::SecretsManager::ResourcePolicy']
  kubernetes:
  - {group: secretsmanager.services.k8s.aws, kind: Secret}
traits:
- {id: proprietary-api, level: low, reason: 'Secret values are portable; the retrieval API, resource policies and ARNs referenced by apps and IaC are AWS-specific.'}
- {id: proprietary-sdk}
rules:
- id: aws.secrets-manager.rotation
  match:
    resource_type: [aws_secretsmanager_secret_rotation]
  then: {add_trait: managed-only-feature, level: medium, evidence: rotation_lambda_arn}
- id: aws.secrets-manager.replication
  match:
    resource_type: [aws_secretsmanager_secret]
  when: {attr: replica, exists: true}
  then: {add_trait: managed-only-feature, level: low, evidence: replica}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-secrets-manager']
  imports: ['[''"]@aws-sdk/client-secrets-manager[''"/]']
  usage: ['\bAWS\.SecretsManager\b']
  gate: [aws-sdk]
- ecosystem: pypi
  packages: [aws-secretsmanager-caching]
  imports: ['^\s*(from|import)\s+aws_secretsmanager_caching\b']
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["'']secretsmanager["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/secretsmanager, github.com/aws/aws-secretsmanager-caching-go/*]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/secretsmanager(/[^"]*)?"', '"github\.com/aws/aws-secretsmanager-caching-go/[^"]+"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:secretsmanager', 'com.amazonaws:aws-java-sdk-secretsmanager', 'com.amazonaws.secretsmanager:aws-secretsmanager-caching-java', 'com.amazonaws.secretsmanager:aws-secretsmanager-jdbc', 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.secretsmanager\.', '^\s*import\s+(static\s+)?com\.amazonaws\.(services\.)?secretsmanager\.']
- ecosystem: nuget
  packages: [AWSSDK.SecretsManager, AWSSDK.SecretsManager.Caching]
  imports: ['^\s*using\s+(static\s+)?Amazon\.SecretsManager\b']
- ecosystem: rubygems
  packages: [aws-sdk-secretsmanager]
  imports: ['^\s*require\s+["'']aws-sdk-(secretsmanager)["'']']
  usage: ['(?i)\bAws::(secretsmanager)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-secretsmanager]
  imports: ['\baws_sdk_(secretsmanager)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(secretsmanager)\\']
  gate: [aws/aws-sdk-php]
kubernetes_bindings:
- match: {kind: SecretProviderClass, group: secrets-store.csi.x-k8s.io, field: spec.provider, equals: aws}
edge_hints:
- {resource_type: aws_secretsmanager_secret_version, attribute: secret_id, edge_kind: containment}
- {resource_type: aws_secretsmanager_secret_policy, attribute: secret_arn, edge_kind: binding}
- {resource_type: aws_secretsmanager_secret_rotation, attribute: secret_id, edge_kind: binding}
- {resource_type: aws_secretsmanager_secret_rotation, attribute: rotation_lambda_arn, edge_kind: reference}
- {resource_type: aws_secretsmanager_secret, attribute: kms_key_id, edge_kind: reference}
alternatives:
- {ref: vault-openbao, difficulty: low, compatibility: conceptual, notes: 'KV secrets and dynamic database credentials replace secrets and rotation; application lookups change.', approved_by: cloudowski}
- {ref: sops, difficulty: low, compatibility: conceptual, notes: Encrypted secrets in Git suit static configuration; no runtime API or automatic rotation., approved_by: cloudowski}
- {ref: scaleway, difficulty: low, compatibility: conceptual, notes: Scaleway Secret Manager stores versioned secrets behind an API., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/secretsmanager_secret']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
