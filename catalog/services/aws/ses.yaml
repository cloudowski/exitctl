schema: '1.0'
kind: service
id: aws.ses
provider: aws
name: Amazon Simple Email Service (SES)
category: integration
resource_types:
  terraform: [aws_ses_domain_identity, aws_ses_domain_identity_verification, aws_ses_domain_dkim, aws_ses_domain_mail_from, aws_ses_email_identity, aws_ses_identity_policy, aws_ses_identity_notification_topic, aws_ses_configuration_set, aws_ses_event_destination, aws_ses_receipt_rule, aws_ses_receipt_rule_set, aws_ses_active_receipt_rule_set, aws_ses_receipt_filter, aws_ses_template, aws_sesv2_email_identity, aws_sesv2_email_identity_policy, aws_sesv2_email_identity_feedback_attributes, aws_sesv2_email_identity_mail_from_attributes, aws_sesv2_configuration_set, aws_sesv2_configuration_set_event_destination, aws_sesv2_contact_list, aws_sesv2_dedicated_ip_pool, aws_sesv2_dedicated_ip_assignment, aws_sesv2_account_vdm_attributes, aws_sesv2_account_suppression_attributes]
  cloudformation: ['AWS::SES::EmailIdentity', 'AWS::SES::ConfigurationSet', 'AWS::SES::ConfigurationSetEventDestination', 'AWS::SES::ContactList', 'AWS::SES::DedicatedIpPool', 'AWS::SES::ReceiptRule', 'AWS::SES::ReceiptRuleSet', 'AWS::SES::ReceiptFilter', 'AWS::SES::Template', 'AWS::SES::VdmAttributes']
  kubernetes:
  - {group: ses.services.k8s.aws, kind: ConfigurationSet}
traits:
- {id: proprietary-api, level: low, reason: 'Sending works over standard SMTP; the SendEmail API, templates, configuration sets and receipt rules are SES-specific.'}
- {id: proprietary-sdk}
rules:
- id: aws.ses.inbound-receipt-rules
  match:
    resource_type: [aws_ses_receipt_rule]
  then: {add_trait: proprietary-event-model, level: medium, evidence: rule_set_name}
- id: aws.ses.templates
  match:
    resource_type: [aws_ses_template]
  then: {add_trait: managed-only-feature, level: low, evidence: name}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-ses', '@aws-sdk/client-sesv2']
  imports: ['[''"]@aws-sdk/client-ses(v2)?[''"/]']
  usage: ['\bAWS\.(SES|SESV2)\b']
  gate: [aws-sdk]
- ecosystem: pypi
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["''](ses|sesv2)["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/ses, github.com/aws/aws-sdk-go-v2/service/sesv2]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/(ses|sesv2)(/[^"]*)?"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:ses', 'software.amazon.awssdk:sesv2', 'com.amazonaws:aws-java-sdk-ses']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.(ses|sesv2)\.', '^\s*import\s+(static\s+)?com\.amazonaws\.services\.simpleemail(v2)?\.']
- ecosystem: nuget
  packages: [AWSSDK.SimpleEmail, AWSSDK.SimpleEmailV2]
  imports: ['^\s*using\s+(static\s+)?Amazon\.(SimpleEmail|SimpleEmailV2)\b']
- ecosystem: rubygems
  packages: [aws-sdk-ses, aws-sdk-sesv2]
  imports: ['^\s*require\s+["'']aws-sdk-(ses|sesv2)["'']']
  usage: ['(?i)\bAws::(ses|sesv2)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-ses, aws-sdk-sesv2]
  imports: ['\baws_sdk_(ses|sesv2)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(ses|sesv2)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_ses_domain_dkim, attribute: domain, edge_kind: reference}
- {resource_type: aws_ses_domain_identity_verification, attribute: domain, edge_kind: reference}
- {resource_type: aws_ses_event_destination, attribute: configuration_set_name, edge_kind: containment}
- {resource_type: aws_ses_event_destination, attribute: sns_destination.topic_arn, edge_kind: data-flow}
- {resource_type: aws_ses_identity_notification_topic, attribute: topic_arn, edge_kind: data-flow}
- {resource_type: aws_ses_receipt_rule, attribute: rule_set_name, edge_kind: containment}
- {resource_type: aws_ses_receipt_rule, attribute: s3_action.bucket_name, edge_kind: data-flow}
- {resource_type: aws_ses_receipt_rule, attribute: lambda_action.function_arn, edge_kind: data-flow}
- {resource_type: aws_sesv2_configuration_set_event_destination, attribute: configuration_set_name, edge_kind: containment}
alternatives:
- {ref: scaleway, difficulty: low, compatibility: protocol-compatible, notes: 'Scaleway Transactional Email accepts SMTP and an HTTP API; DNS records (SPF, DKIM) must be updated.', approved_by: cloudowski}
- {ref: postal, difficulty: medium, compatibility: protocol-compatible, notes: 'Self-hosted mail delivery platform with SMTP, HTTP API and webhooks; IP reputation must be built up.', approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/ses/latest/dg/Welcome.html', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/sesv2_email_identity']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
