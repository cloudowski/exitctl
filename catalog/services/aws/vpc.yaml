traits:
- {id: provider-network-construct, level: medium, reason: 'Subnets, security groups, route tables and endpoints are AWS constructs that every dependent resource references; equivalents exist elsewhere.'}
rules:
- id: aws.vpc.transit-gateway
  match:
    resource_type: [aws_ec2_transit_gateway]
  then: {add_trait: provider-network-construct, level: medium, evidence: description}
- id: aws.vpc.privatelink-service
  match:
    resource_type: [aws_vpc_endpoint_service]
  then: {add_trait: provider-network-construct, level: medium, evidence: network_load_balancer_arns}
- id: aws.vpc.direct-connect
  match:
    resource_type: [aws_dx_connection]
  then: {add_trait: provider-network-construct, level: medium, evidence: location}
- id: aws.vpc.security-group-references
  match:
    resource_type: [aws_vpc_security_group_ingress_rule, aws_security_group_rule]
  when:
    any:
    - {attr: referenced_security_group_id, exists: true}
    - {attr: source_security_group_id, exists: true}
  then: {add_trait: provider-network-construct, level: low, evidence: referenced_security_group_id}
