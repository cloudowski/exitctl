- {resource_type: aws_api_gateway_deployment, attribute: rest_api_id, edge_kind: containment}
- {resource_type: aws_api_gateway_authorizer, attribute: authorizer_uri, edge_kind: reference}
- {resource_type: aws_api_gateway_authorizer, attribute: provider_arns, edge_kind: reference}
- {resource_type: aws_api_gateway_vpc_link, attribute: target_arns, edge_kind: data-flow}
- {resource_type: aws_apigatewayv2_route, attribute: api_id, edge_kind: containment}
- {resource_type: aws_apigatewayv2_integration, attribute: api_id, edge_kind: containment}
- {resource_type: aws_apigatewayv2_integration, attribute: integration_uri, edge_kind: data-flow}
