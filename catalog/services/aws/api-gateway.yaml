- {resource_type: aws_apigatewayv2_authorizer, attribute: authorizer_uri, edge_kind: reference}
- {resource_type: aws_apigatewayv2_vpc_link, attribute: subnet_ids, edge_kind: containment}
alternatives:
- {ref: kong, difficulty: medium, compatibility: conceptual, notes: 'Kong routes, plugins and consumers cover auth, rate limiting and keys; mapping templates need plugins or code.', approved_by: cloudowski}
- {ref: envoy, difficulty: medium, compatibility: conceptual, notes: 'Envoy (or Envoy Gateway) handles routing, JWT auth and rate limits; usage plans need extra components.', approved_by: cloudowski}
- {ref: traefik, difficulty: medium, compatibility: conceptual, notes: Traefik routers and middlewares cover routing and auth on Kubernetes; API keys and quotas need add-ons., approved_by: cloudowski}
- {ref: nginx, difficulty: medium, compatibility: conceptual, notes: NGINX reverse proxy covers routing and TLS; authorizers and usage plans need custom configuration., approved_by: cloudowski}
