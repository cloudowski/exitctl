schema: '1.0'
kind: service
id: aws.kms
provider: aws
name: AWS Key Management Service (KMS)
category: security.kms
resource_types:
  terraform: [aws_kms_key, aws_kms_alias, aws_kms_grant, aws_kms_key_policy, aws_kms_external_key, aws_kms_replica_key, aws_kms_replica_external_key, aws_kms_ciphertext, aws_kms_custom_key_store, aws_cloudhsm_v2_cluster, aws_cloudhsm_v2_hsm]
  cloudformation: ['AWS::KMS::Key', 'AWS::KMS::Alias', 'AWS::KMS::ReplicaKey', 'AWS::CloudHSM::Cluster', 'AWS::CloudHSM::Hsm']
  kubernetes:
  - {group: kms.services.k8s.aws, kind: Key}
  - {group: kms.services.k8s.aws, kind: Alias}
  - {group: kms.services.k8s.aws, kind: Grant}
traits:
- {id: proprietary-api, level: medium, reason: 'Encrypt, decrypt and grant APIs plus key policies are AWS-specific; envelope encryption concepts transfer.'}
- {id: non-exportable-data, reason: 'Key material generated in KMS cannot be exported; data encrypted under it must be decrypted on AWS and re-encrypted.'}
rules:
- id: aws.kms.multi-region
  match:
    resource_type: [aws_kms_key]
  when: {attr: multi_region, equals: true}
  then: {add_trait: managed-only-feature, level: low, evidence: multi_region}
- id: aws.kms.custom-key-store
  match:
    resource_type: [aws_kms_custom_key_store, aws_cloudhsm_v2_cluster]
  then: {add_trait: operational-tooling-coupling, level: medium, evidence: custom_key_store_name}
- id: aws.kms.imported-key-material
  match:
    resource_type: [aws_kms_external_key, aws_kms_replica_external_key]
  then: {set_level: {trait: non-exportable-data, level: low}, evidence: key_material_base64}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-kms', '@aws-crypto/client-node', '@aws-crypto/client-browser', '@aws-crypto/kms-keyring-node']
  imports: ['[''"]@aws-sdk/client-kms[''"/]', '[''"]@aws-crypto/(client-node|client-browser|kms-keyring[^''"]*)[''"]']
  usage: ['\bAWS\.KMS\b']
  gate: [aws-sdk]
- ecosystem: pypi
  packages: [aws-encryption-sdk]
  imports: ['^\s*(from|import)\s+aws_encryption_sdk\b']
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["''](kms|cloudhsmv2)["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/kms, github.com/aws/aws-sdk-go-v2/service/cloudhsmv2]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/(kms|cloudhsmv2)(/[^"]*)?"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:kms', 'software.amazon.awssdk:cloudhsmv2', 'com.amazonaws:aws-java-sdk-kms', 'com.amazonaws:aws-encryption-sdk-java']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.(kms|cloudhsmv2)\.', '^\s*import\s+(static\s+)?com\.amazonaws\.(services\.kms|encryptionsdk)\.']
- ecosystem: nuget
  packages: [AWSSDK.KeyManagementService, AWSSDK.CloudHSMV2, AWS.Cryptography.EncryptionSDK]
  imports: ['^\s*using\s+(static\s+)?Amazon\.(KeyManagementService|CloudHSMV2)\b', '^\s*using\s+(static\s+)?AWS\.Cryptography\.EncryptionSDK\b']
- ecosystem: rubygems
  packages: [aws-sdk-kms, aws-sdk-cloudhsmv2]
  imports: ['^\s*require\s+["'']aws-sdk-(kms|cloudhsmv2)["'']']
  usage: ['(?i)\bAws::(kms|cloudhsmv2)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-kms, aws-sdk-cloudhsmv2]
  imports: ['\baws_sdk_(kms|cloudhsmv2)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(kms|cloudhsmv2)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_kms_alias, attribute: target_key_id, edge_kind: reference}
- {resource_type: aws_kms_grant, attribute: key_id, edge_kind: binding}
- {resource_type: aws_kms_grant, attribute: grantee_principal, edge_kind: binding}
- {resource_type: aws_kms_key_policy, attribute: key_id, edge_kind: binding}
- {resource_type: aws_kms_replica_key, attribute: primary_key_arn, edge_kind: data-flow}
- {resource_type: aws_kms_key, attribute: custom_key_store_id, edge_kind: containment}
- {resource_type: aws_cloudhsm_v2_hsm, attribute: cluster_id, edge_kind: containment}
- {resource_type: aws_cloudhsm_v2_cluster, attribute: subnet_ids, edge_kind: containment}
alternatives:
- {ref: vault-openbao, difficulty: medium, compatibility: conceptual, notes: 'The Transit engine provides encryption as a service and key rotation; data must be re-encrypted under new keys.', approved_by: cloudowski}
- {ref: scaleway, difficulty: medium, compatibility: conceptual, notes: Scaleway Key Manager offers managed symmetric keys for envelope encryption., approved_by: cloudowski}
- {ref: ovhcloud, difficulty: medium, compatibility: conceptual, notes: OVHcloud KMS provides managed keys with a KMIP and REST interface., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/kms/latest/developerguide/overview.html', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/kms_key']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
