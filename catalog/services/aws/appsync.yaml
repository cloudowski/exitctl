schema: '1.0'
kind: service
id: aws.appsync
provider: aws
name: AWS AppSync
category: integration
resource_types:
  terraform: [aws_appsync_graphql_api, aws_appsync_datasource, aws_appsync_resolver, aws_appsync_function, aws_appsync_api_key, aws_appsync_api_cache, aws_appsync_domain_name, aws_appsync_domain_name_api_association, aws_appsync_type, aws_appsync_source_api_association]
  cloudformation: ['AWS::AppSync::GraphQLApi', 'AWS::AppSync::GraphQLSchema', 'AWS::AppSync::DataSource', 'AWS::AppSync::Resolver', 'AWS::AppSync::FunctionConfiguration', 'AWS::AppSync::ApiKey', 'AWS::AppSync::ApiCache', 'AWS::AppSync::DomainName', 'AWS::AppSync::DomainNameApiAssociation', 'AWS::AppSync::SourceApiAssociation', 'AWS::AppSync::Api', 'AWS::AppSync::ChannelNamespace']
traits:
- {id: proprietary-api, level: medium, reason: 'The GraphQL schema is portable, but resolvers, auth directives (@aws_*) and real-time subscriptions are AppSync-specific.'}
- {id: proprietary-runtime, level: medium, reason: Resolvers are written in VTL or the APPSYNC_JS runtime and run only on AppSync.}
rules:
- id: aws.appsync.direct-datasource
  match:
    resource_type: [aws_appsync_datasource]
  when: {attr: type, in: [AMAZON_DYNAMODB, RELATIONAL_DATABASE, AMAZON_OPENSEARCH_SERVICE, AMAZON_EVENTBRIDGE]}
  then: {add_trait: managed-only-feature, level: medium, evidence: type}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-appsync', 'aws-appsync', '@aws-appsync/utils']
  imports: ['[''"]@aws-sdk/client-appsync[''"/]', '[''"]aws-appsync[''"]', '[''"]@aws-appsync/[^''"]+[''"]']
  usage: ['\bAWS\.AppSync\b']
  gate: [aws-sdk]
- ecosystem: pypi
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["'']appsync["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/appsync]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/appsync(/[^"]*)?"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:appsync']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.appsync\.']
- ecosystem: nuget
  packages: [AWSSDK.AppSync]
  imports: ['^\s*using\s+(static\s+)?Amazon\.AppSync\b']
- ecosystem: rubygems
  packages: [aws-sdk-appsync]
  imports: ['^\s*require\s+["'']aws-sdk-(appsync)["'']']
  usage: ['(?i)\bAws::(appsync)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-appsync]
  imports: ['\baws_sdk_(appsync)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(appsync)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_appsync_datasource, attribute: api_id, edge_kind: containment}
- {resource_type: aws_appsync_datasource, attribute: dynamodb_config.table_name, edge_kind: data-flow}
- {resource_type: aws_appsync_datasource, attribute: lambda_config.function_arn, edge_kind: data-flow}
- {resource_type: aws_appsync_datasource, attribute: service_role_arn, edge_kind: binding}
- {resource_type: aws_appsync_resolver, attribute: api_id, edge_kind: containment}
- {resource_type: aws_appsync_resolver, attribute: data_source, edge_kind: reference}
- {resource_type: aws_appsync_function, attribute: api_id, edge_kind: containment}
- {resource_type: aws_appsync_graphql_api, attribute: user_pool_config.user_pool_id, edge_kind: reference}
alternatives:
- {ref: hasura, difficulty: medium, compatibility: conceptual, notes: 'Hasura serves GraphQL with subscriptions over PostgreSQL and remote schemas; resolvers and auth rules are rewritten.', approved_by: cloudowski}
- {ref: kong, difficulty: high, compatibility: conceptual, notes: Kong can front a self-hosted GraphQL server (e.g. Apollo) for auth and rate limits; resolver logic moves to code., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/appsync/latest/devguide/what-is-appsync.html', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/appsync_graphql_api']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
