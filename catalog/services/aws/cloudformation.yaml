schema: '1.0'
kind: service
id: aws.cloudformation
provider: aws
name: AWS CloudFormation
category: devops.iac
resource_types:
  terraform: [aws_cloudformation_stack, aws_cloudformation_stack_set, aws_cloudformation_stack_set_instance, aws_cloudformation_stack_instances, aws_cloudformation_type]
  cloudformation: ['AWS::CloudFormation::Stack', 'AWS::CloudFormation::StackSet', 'AWS::CloudFormation::CustomResource', 'Custom::*', 'AWS::CloudFormation::WaitCondition', 'AWS::CloudFormation::WaitConditionHandle', 'AWS::CloudFormation::Macro', 'AWS::CloudFormation::HookVersion', 'AWS::CloudFormation::ResourceVersion', 'AWS::CloudFormation::ModuleVersion']
traits:
- {id: operational-tooling-coupling, level: medium, reason: 'Stacks, stack sets, custom resources and macros are deployed and tracked only by CloudFormation.'}
- {id: skills-specialization, level: low, reason: 'CloudFormation templates and their intrinsic functions do not transfer to other infrastructure-as-code tools.'}
rules:
- id: aws.cloudformation.custom-resource
  match:
    resource_type: ['Custom::*', 'AWS::CloudFormation::CustomResource']
  then: {add_trait: proprietary-event-model, level: low, evidence: ServiceToken}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-cloudformation', 'aws-cdk-lib', 'aws-cdk']
  imports: ['[''"](@aws-sdk/client-cloudformation|aws-cdk-lib)[''"/]']
- ecosystem: pypi
  packages: [aws-cdk-lib]
  imports: ['^\s*(from|import)\s+aws_cdk\b']
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["'']cloudformation["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/cloudformation, github.com/aws/aws-cdk-go/awscdk/v2]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/cloudformation(/[^"]*)?"', '"github\.com/aws/aws-cdk-go/awscdk/v2(/[^"]*)?"']
- ecosystem: rubygems
  packages: [aws-sdk-cloudformation]
  imports: ['^\s*require\s+["'']aws-sdk-(cloudformation)["'']']
  usage: ['(?i)\bAws::(cloudformation)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-cloudformation]
  imports: ['\baws_sdk_(cloudformation)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(cloudformation)\\']
  gate: [aws/aws-sdk-php]
alternatives:
- {ref: opentofu, difficulty: medium, compatibility: conceptual, notes: 'Templates are rewritten in HCL; existing resources can be imported into OpenTofu state without recreating them.', recommended: true, approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html
  - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/template-custom-resources.html
  - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/cloudformation_stack
  llm: {batch: 2026-10-07-eks-workshop, model: claude-opus-5-5, prompt_version: catalog-coverage-v1, eval_passed: true}
