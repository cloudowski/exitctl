schema: '1.0'
kind: service
id: aws.ecr
provider: aws
name: Amazon Elastic Container Registry (ECR)
category: devops.registry
resource_types:
  terraform: [aws_ecr_repository, aws_ecr_repository_policy, aws_ecr_lifecycle_policy, aws_ecr_registry_policy, aws_ecr_replication_configuration, aws_ecr_pull_through_cache_rule, aws_ecr_registry_scanning_configuration, aws_ecr_repository_creation_template, aws_ecr_account_setting, aws_ecrpublic_repository, aws_ecrpublic_repository_policy, aws_ecr_authorization_token, aws_ecrpublic_authorization_token, aws_ecr_image, aws_ecr_repositories]
  cloudformation: ['AWS::ECR::Repository', 'AWS::ECR::RegistryPolicy', 'AWS::ECR::ReplicationConfiguration', 'AWS::ECR::PullThroughCacheRule', 'AWS::ECR::RegistryScanningConfiguration', 'AWS::ECR::RepositoryCreationTemplate', 'AWS::ECR::PublicRepository']
  kubernetes:
  - {group: ecr.services.k8s.aws, kind: Repository}
  - {group: ecr.services.k8s.aws, kind: PullThroughCacheRule}
  container_registry: ['*.dkr.ecr.*.amazonaws.com', 'public.ecr.aws']
  ci_action: [aws-actions/amazon-ecr-login]
traits:
- {id: provider-registry, level: low, reason: 'ECR serves standard OCI images; image references, pull credentials and lifecycle policies are AWS-specific.'}
rules:
- id: aws.ecr.pull-through-cache
  match:
    resource_type: [aws_ecr_pull_through_cache_rule]
  then: {add_trait: managed-only-feature, level: low, evidence: upstream_registry_url}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-ecr', '@aws-sdk/client-ecr-public']
  imports: ['[''"]@aws-sdk/client-ecr(-public)?[''"/]']
  usage: ['\bAWS\.(ECR|ECRPUBLIC)\b']
  gate: [aws-sdk]
- ecosystem: pypi
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["''](ecr|ecr-public)["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/ecr, github.com/aws/aws-sdk-go-v2/service/ecrpublic, github.com/awslabs/amazon-ecr-credential-helper/*]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/(ecr|ecrpublic)(/[^"]*)?"', '"github\.com/awslabs/amazon-ecr-credential-helper/[^"]+"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:ecr', 'software.amazon.awssdk:ecrpublic', 'com.amazonaws:aws-java-sdk-ecr']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.(ecr|ecrpublic)\.', '^\s*import\s+(static\s+)?com\.amazonaws\.services\.ecr\.']
- ecosystem: nuget
  packages: [AWSSDK.ECR, AWSSDK.ECRPublic]
  imports: ['^\s*using\s+(static\s+)?Amazon\.(ECR|ECRPublic)\b']
- ecosystem: rubygems
  packages: [aws-sdk-ecr, aws-sdk-ecrpublic]
  imports: ['^\s*require\s+["'']aws-sdk-(ecr|ecrpublic)["'']']
  usage: ['(?i)\bAws::(ecr|ecrpublic)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-ecr, aws-sdk-ecrpublic]
  imports: ['\baws_sdk_(ecr|ecrpublic)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(ecr|ecrpublic)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_ecr_repository_policy, attribute: repository, edge_kind: binding}
- {resource_type: aws_ecr_lifecycle_policy, attribute: repository, edge_kind: containment}
- {resource_type: aws_ecrpublic_repository_policy, attribute: repository_name, edge_kind: binding}
- {resource_type: aws_ecr_pull_through_cache_rule, attribute: credential_arn, edge_kind: reference}
alternatives:
- {ref: harbor, difficulty: low, compatibility: protocol-compatible, notes: 'OCI-compliant registry with replication, scanning and proxy cache; images move with skopeo or crane.', approved_by: cloudowski}
- {ref: forgejo, difficulty: low, compatibility: protocol-compatible, notes: Forgejo package registry hosts OCI container images next to source code., approved_by: cloudowski}
- {ref: gitea, difficulty: low, compatibility: protocol-compatible, notes: Gitea package registry hosts OCI container images next to source code., approved_by: cloudowski}
- {ref: scaleway, difficulty: low, compatibility: protocol-compatible, notes: Scaleway Container Registry is a managed OCI registry., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html', 'https://github.com/aws-actions/amazon-ecr-login', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/ecr_repository']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
