schema: '1.0'
kind: service
id: aws.route53
provider: aws
name: Amazon Route 53
category: network.dns
resource_types:
  terraform: [aws_route53_zone, aws_route53_record, aws_route53_records_exclusive, aws_route53_health_check, aws_route53_delegation_set, aws_route53_query_log, aws_route53_zone_association, aws_route53_vpc_association_authorization, aws_route53_key_signing_key, aws_route53_hosted_zone_dnssec, aws_route53_traffic_policy, aws_route53_traffic_policy_instance, aws_route53_cidr_collection, aws_route53_cidr_location, aws_route53_resolver_endpoint, aws_route53_resolver_rule, aws_route53_resolver_rule_association, aws_route53_resolver_query_log_config, aws_route53_resolver_query_log_config_association, aws_route53_resolver_firewall_domain_list, aws_route53_resolver_firewall_rule_group, aws_route53_resolver_firewall_rule, aws_route53_resolver_firewall_rule_group_association, aws_route53_resolver_dnssec_config, aws_route53domains_registered_domain, aws_route53domains_delegation_signer_record]
  cloudformation: ['AWS::Route53::HostedZone', 'AWS::Route53::RecordSet', 'AWS::Route53::RecordSetGroup', 'AWS::Route53::HealthCheck', 'AWS::Route53::KeySigningKey', 'AWS::Route53::DNSSEC', 'AWS::Route53::CidrCollection', 'AWS::Route53Resolver::ResolverEndpoint', 'AWS::Route53Resolver::ResolverRule', 'AWS::Route53Resolver::ResolverRuleAssociation', 'AWS::Route53Resolver::ResolverQueryLoggingConfig', 'AWS::Route53Resolver::ResolverQueryLoggingConfigAssociation', 'AWS::Route53Resolver::FirewallDomainList', 'AWS::Route53Resolver::FirewallRuleGroup', 'AWS::Route53Resolver::FirewallRuleGroupAssociation']
  kubernetes:
  - {group: route53.services.k8s.aws, kind: HostedZone}
  - {group: route53.services.k8s.aws, kind: RecordSet}
  - {group: route53.services.k8s.aws, kind: HealthCheck}
traits:
- {id: provider-network-construct, level: low, reason: 'Public zones hold standard DNS records that export as zone files; alias records, routing policies and private zones are AWS-specific.'}
rules:
- id: aws.route53.alias-records
  match:
    resource_type: [aws_route53_record]
  when: {attr: alias, exists: true}
  then: {add_trait: managed-only-feature, level: low, evidence: alias}
- id: aws.route53.routing-policies
  match:
    resource_type: [aws_route53_record]
  when:
    any:
    - {attr: latency_routing_policy, exists: true}
    - {attr: geolocation_routing_policy, exists: true}
    - {attr: geoproximity_routing_policy, exists: true}
    - {attr: failover_routing_policy, exists: true}
    - {attr: weighted_routing_policy, exists: true}
    - {attr: cidr_routing_policy, exists: true}
  then: {add_trait: managed-only-feature, level: medium, evidence: set_identifier}
- id: aws.route53.traffic-policy
  match:
    resource_type: [aws_route53_traffic_policy]
  then: {add_trait: managed-only-feature, level: medium, evidence: document}
- id: aws.route53.private-zone
  match:
    resource_type: [aws_route53_zone]
  when: {attr: vpc, exists: true}
  then: {add_trait: provider-network-construct, level: low, evidence: vpc}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-route-53', '@aws-sdk/client-route-53-domains', '@aws-sdk/client-route53resolver']
  imports: ['[''"]@aws-sdk/client-(route-53|route-53-domains|route53resolver)[''"/]']
  usage: ['\bAWS\.(Route53|Route53Domains|Route53Resolver)\b']
  gate: [aws-sdk]
- ecosystem: pypi
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["''](route53|route53domains|route53resolver)["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/route53, github.com/aws/aws-sdk-go-v2/service/route53domains, github.com/aws/aws-sdk-go-v2/service/route53resolver]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/(route53|route53domains|route53resolver)(/[^"]*)?"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:route53', 'software.amazon.awssdk:route53domains', 'software.amazon.awssdk:route53resolver', 'com.amazonaws:aws-java-sdk-route53']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.(route53|route53domains|route53resolver)\.', '^\s*import\s+(static\s+)?com\.amazonaws\.services\.route53\.']
- ecosystem: nuget
  packages: [AWSSDK.Route53, AWSSDK.Route53Domains, AWSSDK.Route53Resolver]
  imports: ['^\s*using\s+(static\s+)?Amazon\.(Route53|Route53Domains|Route53Resolver)\b']
- ecosystem: rubygems
  packages: [aws-sdk-route53, aws-sdk-route53domains, aws-sdk-route53resolver]
  imports: ['^\s*require\s+["'']aws-sdk-(route53|route53domains|route53resolver)["'']']
  usage: ['(?i)\bAws::(route53|route53domains|route53resolver)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-route53, aws-sdk-route53domains, aws-sdk-route53resolver]
  imports: ['\baws_sdk_(route53|route53domains|route53resolver)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(route53|route53domains|route53resolver)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_route53_record, attribute: zone_id, edge_kind: containment}
- {resource_type: aws_route53_record, attribute: alias.name, edge_kind: reference}
- {resource_type: aws_route53_record, attribute: health_check_id, edge_kind: reference}
- {resource_type: aws_route53_zone_association, attribute: zone_id, edge_kind: binding}
- {resource_type: aws_route53_zone_association, attribute: vpc_id, edge_kind: binding}
- {resource_type: aws_route53_zone, attribute: vpc.vpc_id, edge_kind: binding}
- {resource_type: aws_route53_query_log, attribute: cloudwatch_log_group_arn, edge_kind: data-flow}
- {resource_type: aws_route53_resolver_endpoint, attribute: ip_address.subnet_id, edge_kind: containment}
- {resource_type: aws_route53_resolver_rule_association, attribute: vpc_id, edge_kind: binding}
alternatives:
- {ref: hetzner, difficulty: low, compatibility: protocol-compatible, notes: 'Hetzner DNS hosts standard zones; alias and latency/geo routing records must be replaced by plain records.', approved_by: cloudowski}
- {ref: ovhcloud, difficulty: low, compatibility: protocol-compatible, notes: OVHcloud DNS hosts zones with zone file import and DNSSEC., approved_by: cloudowski}
- {ref: scaleway, difficulty: low, compatibility: protocol-compatible, notes: Scaleway Domains and DNS hosts zones with zone file import., approved_by: cloudowski}
- {ref: coredns, difficulty: medium, compatibility: protocol-compatible, notes: Self-hosted authoritative or internal DNS; replaces private hosted zones and resolver rules., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/route53_record']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
