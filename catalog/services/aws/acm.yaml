schema: '1.0'
kind: service
id: aws.acm
provider: aws
name: AWS Certificate Manager (ACM)
category: security.kms
resource_types:
  terraform: [aws_acm_certificate, aws_acm_certificate_validation, aws_acmpca_certificate_authority, aws_acmpca_certificate_authority_certificate, aws_acmpca_certificate, aws_acmpca_permission, aws_acmpca_policy]
  cloudformation: ['AWS::CertificateManager::Certificate', 'AWS::CertificateManager::Account', 'AWS::ACMPCA::CertificateAuthority', 'AWS::ACMPCA::CertificateAuthorityActivation', 'AWS::ACMPCA::Certificate', 'AWS::ACMPCA::Permission']
  kubernetes:
  - {group: acm.services.k8s.aws, kind: Certificate}
  - {group: acmpca.services.k8s.aws, kind: CertificateAuthority}
  - {group: acmpca.services.k8s.aws, kind: Certificate}
  - {group: awspca.cert-manager.io, kind: AWSPCAClusterIssuer}
  - {group: awspca.cert-manager.io, kind: AWSPCAIssuer}
traits:
- {id: operational-tooling-coupling, level: low, reason: 'Public ACM certificates are free but usable only on integrated AWS services; replacements come from any public CA.'}
rules:
- id: aws.acm.private-ca
  match:
    resource_type: [aws_acmpca_certificate_authority]
  then: {add_trait: managed-only-feature, level: medium, evidence: type}
sdk:
- ecosystem: npm
  packages: ['@aws-sdk/client-acm', '@aws-sdk/client-acm-pca']
  imports: ['[''"]@aws-sdk/client-acm(-pca)?[''"/]']
  usage: ['\bAWS\.(ACM|ACMPCA)\b']
  gate: [aws-sdk]
- ecosystem: pypi
  usage: ['\.(client|resource)\(\s*(service_name\s*=\s*)?["''](acm|acm-pca)["'']']
  gate: [boto3, aioboto3]
- ecosystem: go
  packages: [github.com/aws/aws-sdk-go-v2/service/acm, github.com/aws/aws-sdk-go-v2/service/acmpca]
  imports: ['"github\.com/aws/aws-sdk-go(-v2)?/service/(acm|acmpca)(/[^"]*)?"']
- ecosystem: maven
  packages: ['software.amazon.awssdk:acm', 'software.amazon.awssdk:acmpca']
  imports: ['^\s*import\s+(static\s+)?software\.amazon\.awssdk\.services\.(acm|acmpca)\.']
- ecosystem: nuget
  packages: [AWSSDK.CertificateManager, AWSSDK.ACMPCA]
  imports: ['^\s*using\s+(static\s+)?Amazon\.(CertificateManager|ACMPCA)\b']
- ecosystem: rubygems
  packages: [aws-sdk-acm, aws-sdk-acmpca]
  imports: ['^\s*require\s+["'']aws-sdk-(acm|acmpca)["'']']
  usage: ['(?i)\bAws::(acm|acmpca)::']
  gate: [aws-sdk, aws-sdk-resources]
- ecosystem: cargo
  packages: [aws-sdk-acm, aws-sdk-acmpca]
  imports: ['\baws_sdk_(acm|acmpca)\b']
- ecosystem: composer
  usage: ['(?i)\bAws\\(acm|acmpca)\\']
  gate: [aws/aws-sdk-php]
edge_hints:
- {resource_type: aws_acm_certificate_validation, attribute: certificate_arn, edge_kind: binding}
- {resource_type: aws_acm_certificate_validation, attribute: validation_record_fqdns, edge_kind: reference}
- {resource_type: aws_acm_certificate, attribute: certificate_authority_arn, edge_kind: reference}
- {resource_type: aws_acmpca_certificate, attribute: certificate_authority_arn, edge_kind: containment}
- {resource_type: aws_acmpca_certificate_authority_certificate, attribute: certificate_authority_arn, edge_kind: binding}
alternatives:
- {ref: cert-manager, difficulty: low, compatibility: conceptual, notes: 'cert-manager issues and renews certificates in Kubernetes from ACME, Vault or private CAs.', approved_by: cloudowski, recommended: true}
- {ref: letsencrypt, difficulty: low, compatibility: conceptual, notes: Free public ACME certificates replace public ACM certificates on self-managed load balancers., approved_by: cloudowski}
- {ref: vault-openbao, difficulty: medium, compatibility: conceptual, notes: The PKI secrets engine replaces AWS Private CA for internal certificates., approved_by: cloudowski}
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources: ['https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html', 'https://github.com/cert-manager/aws-privateca-issuer', 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/acm_certificate']
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
