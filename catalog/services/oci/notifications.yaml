schema: '1.0'
kind: service
id: oci.notifications
provider: oci
name: OCI Notifications
category: messaging.pubsub
resource_types:
  terraform:
  - oci_ons_notification_topic
  - oci_ons_subscription
traits:
- {id: proprietary-api, level: medium, reason: Topics are published to through the OCI Notifications API or SDKs.}
- {id: proprietary-event-model, level: low, reason: Subscribers receive OCI-formatted messages and confirmation requests.}
sdk:
- ecosystem: npm
  packages: [oci-ons]
  imports: ['[''"]oci-ons[''"]']
- ecosystem: pypi
  imports: ['^\s*from\s+oci\.ons\b', '^\s*from\s+oci\s+import\s+.*\bons\b']
  usage: ['\boci\.ons\.(NotificationDataPlaneClient|NotificationControlPlaneClient)\b']
  gate: [oci]
- ecosystem: go
  packages: [github.com/oracle/oci-go-sdk/v65/ons]
  imports: ['"github\.com/oracle/oci-go-sdk/v[0-9]+/ons(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.oracle.oci.sdk:oci-java-sdk-ons']
  imports: ['^\s*import\s+com\.oracle\.bmc\.ons\.']
- ecosystem: nuget
  packages: [OCI.DotNetSDK.Ons]
  imports: ['^\s*using\s+Oci\.OnsService\b']
edge_hints:
- {resource_type: oci_ons_notification_topic, attribute: compartment_id, edge_kind: containment}
- {resource_type: oci_ons_subscription, attribute: topic_id, edge_kind: containment}
- {resource_type: oci_ons_subscription, attribute: endpoint, edge_kind: data-flow}
alternatives:
- ref: nats
  difficulty: medium
  compatibility: conceptual
  notes: Subjects replace topics for service fan-out; email and SMS delivery need a separate component.
  approved_by: cloudowski
- ref: rabbitmq
  difficulty: medium
  compatibility: conceptual
  notes: Fanout exchanges replace topics; HTTPS, email and SMS delivery need consumers or plugins.
  approved_by: cloudowski
- ref: grafana
  difficulty: low
  compatibility: conceptual
  notes: For alert routing use, Grafana alerting contact points deliver to email, Slack, PagerDuty and webhooks.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://docs.oracle.com/en-us/iaas/Content/Notification/home.htm
  - https://registry.terraform.io/providers/oracle/oci/latest/docs/resources/ons_notification_topic
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
