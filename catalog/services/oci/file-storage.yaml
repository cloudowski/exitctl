schema: '1.0'
kind: service
id: oci.file-storage
provider: oci
name: OCI File Storage
category: storage.file
resource_types:
  terraform:
  - oci_file_storage_file_system
  - oci_file_storage_mount_target
  - oci_file_storage_export
  - oci_file_storage_export_set
  - oci_file_storage_snapshot
  - oci_file_storage_replication
  - oci_file_storage_filesystem_snapshot_policy
  - oci_file_storage_outbound_connector
  - oci_file_storage_file_system_quota_rule
traits:
- {id: proprietary-api, level: low, reason: Clients mount standard NFSv3 exports; only provisioning and snapshots are OCI specific.}
- {id: data-gravity, level: medium, reason: 'Shared file data is copied out with rsync or similar tools while clients keep writing; large shares need staged syncs.'}
kubernetes_bindings:
- match: {kind: StorageClass, field: provisioner, in: [fss.csi.oraclecloud.com]}
- match: {kind: PersistentVolume, field: spec.csi.driver, in: [fss.csi.oraclecloud.com]}
sdk:
- ecosystem: npm
  packages: [oci-filestorage]
  imports: ['[''"]oci-filestorage[''"]']
- ecosystem: pypi
  imports: ['^\s*from\s+oci\.file_storage\b', '^\s*from\s+oci\s+import\s+.*\bfile_storage\b']
  usage: ['\boci\.file_storage\.FileStorageClient\b']
  gate: [oci]
- ecosystem: go
  packages: [github.com/oracle/oci-go-sdk/v65/filestorage]
  imports: ['"github\.com/oracle/oci-go-sdk/v[0-9]+/filestorage(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.oracle.oci.sdk:oci-java-sdk-filestorage']
  imports: ['^\s*import\s+com\.oracle\.bmc\.filestorage\.']
- ecosystem: nuget
  packages: [OCI.DotNetSDK.Filestorage]
  imports: ['^\s*using\s+Oci\.FilestorageService\b']
edge_hints:
- {resource_type: oci_file_storage_file_system, attribute: compartment_id, edge_kind: containment}
- {resource_type: oci_file_storage_file_system, attribute: kms_key_id, edge_kind: reference}
- {resource_type: oci_file_storage_mount_target, attribute: subnet_id, edge_kind: containment}
- {resource_type: oci_file_storage_mount_target, attribute: nsg_ids, edge_kind: binding}
- {resource_type: oci_file_storage_export, attribute: export_set_id, edge_kind: containment}
- {resource_type: oci_file_storage_export, attribute: file_system_id, edge_kind: binding}
- {resource_type: oci_file_storage_export_set, attribute: mount_target_id, edge_kind: containment}
- {resource_type: oci_file_storage_snapshot, attribute: file_system_id, edge_kind: containment}
- {resource_type: oci_file_storage_replication, attribute: source_id, edge_kind: binding}
- {resource_type: oci_file_storage_replication, attribute: target_id, edge_kind: binding}
alternatives:
- ref: ceph
  difficulty: medium
  compatibility: conceptual
  notes: CephFS via ceph-csi, or NFS through the NFS gateway, replaces shared file systems.
  approved_by: cloudowski
- ref: ovhcloud
  difficulty: low
  compatibility: protocol-compatible
  notes: Managed NFS file storage (Enterprise File Storage, NAS-HA); mount targets and exports are recreated.
  approved_by: cloudowski
- ref: scaleway
  difficulty: low
  compatibility: conceptual
  notes: Managed File Storage attached to instances and Kapsule; check protocol and region availability.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://docs.oracle.com/en-us/iaas/Content/File/home.htm
  - https://docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/contengcreatingpersistentvolumeclaim_Provisioning_PVCs_on_FSS.htm
  - https://registry.terraform.io/providers/oracle/oci/latest/docs/resources/file_storage_file_system
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
