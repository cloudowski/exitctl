schema: '1.0'
kind: service
id: oci.functions
provider: oci
name: OCI Functions
category: compute.serverless
resource_types:
  terraform:
  - oci_functions_application
  - oci_functions_function
  - oci_functions_invoke_function
traits:
- {id: proprietary-runtime, level: low, reason: Functions are container images built on the open source Fn Project FDKs.}
- {id: proprietary-event-model, level: medium, reason: 'Triggers from Events, Notifications, API Gateway and Connector Hub use OCI payload formats.'}
- {id: operational-tooling-coupling, level: low, reason: 'Deployment, logging and resource principal auth go through OCI tooling.'}
sdk:
- ecosystem: npm
  packages: [oci-functions, '@fnproject/fdk']
  imports: ['[''"](oci-functions|@fnproject/fdk)[''"]']
- ecosystem: pypi
  packages: [fdk]
  imports: ['^\s*(from|import)\s+fdk\b', '^\s*from\s+oci\.functions\b', '^\s*from\s+oci\s+import\s+.*\bfunctions\b']
  usage: ['\boci\.functions\.(FunctionsInvokeClient|FunctionsManagementClient)\b']
  gate: [oci]
- ecosystem: go
  packages: [github.com/oracle/oci-go-sdk/v65/functions, github.com/fnproject/fdk-go]
  imports: ['"github\.com/oracle/oci-go-sdk/v[0-9]+/functions(/[^"]*)?"', '"github\.com/fnproject/fdk-go(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.oracle.oci.sdk:oci-java-sdk-functions', 'com.fnproject.fn:api']
  imports: ['^\s*import\s+com\.oracle\.bmc\.functions\.', '^\s*import\s+com\.fnproject\.fn\.']
- ecosystem: nuget
  packages: [OCI.DotNetSDK.Functions, Fnproject.Fn.Fdk]
  imports: ['^\s*using\s+Oci\.FunctionsService\b', '^\s*using\s+Fnproject\.Fn\.Fdk\b']
edge_hints:
- {resource_type: oci_functions_application, attribute: compartment_id, edge_kind: containment}
- {resource_type: oci_functions_application, attribute: subnet_ids, edge_kind: containment}
- {resource_type: oci_functions_application, attribute: network_security_group_ids, edge_kind: binding}
- {resource_type: oci_functions_function, attribute: application_id, edge_kind: containment}
- {resource_type: oci_functions_invoke_function, attribute: function_id, edge_kind: binding}
alternatives:
- ref: fn-project
  difficulty: low
  compatibility: api-compatible
  notes: OCI Functions is based on Fn; the same function images and FDKs run on a self-hosted Fn server.
  residual_traits:
  - {id: proprietary-event-model, level: low, reason: OCI event triggers are replaced by own HTTP or queue triggers.}
  approved_by: cloudowski
- ref: knative
  difficulty: medium
  compatibility: conceptual
  notes: Function containers run as Knative Services; FDK entrypoints and triggers need adapting.
  approved_by: cloudowski
- ref: openfaas
  difficulty: medium
  compatibility: conceptual
  notes: Functions become OpenFaaS functions; handler signatures and triggers are adapted.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://docs.oracle.com/en-us/iaas/Content/Functions/home.htm
  - https://fnproject.io/
  - https://registry.terraform.io/providers/oracle/oci/latest/docs/resources/functions_function
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
