schema: '1.0'
kind: service
id: oci.nosql
provider: oci
name: OCI NoSQL Database Cloud Service
category: database.nosql
resource_types:
  terraform:
  - oci_nosql_table
  - oci_nosql_index
  - oci_nosql_table_replica
  - oci_nosql_configuration
traits:
- {id: proprietary-api, level: high, reason: Data access uses the Oracle NoSQL drivers and service API only.}
- {id: proprietary-data-model, level: high, reason: 'Tables with shard keys, TTL and provisioned read/write units shape the data model.'}
- {id: proprietary-query-language, level: high, reason: Queries use the Oracle NoSQL SQL dialect.}
- {id: data-gravity, level: medium, reason: Tables need export and reimport to move.}
- {id: proprietary-sdk}
sdk:
- ecosystem: npm
  packages: [oracle-nosqldb, oci-nosql]
  imports: ['[''"](oracle-nosqldb|oci-nosql)[''"]']
- ecosystem: pypi
  packages: [borneo]
  imports: ['^\s*(from|import)\s+borneo\b', '^\s*from\s+oci\.nosql\b', '^\s*from\s+oci\s+import\s+.*\bnosql\b']
  usage: ['\boci\.nosql\.NosqlClient\b']
  gate: [oci]
- ecosystem: go
  packages: [github.com/oracle/nosql-go-sdk, github.com/oracle/oci-go-sdk/v65/nosql]
  imports: ['"github\.com/oracle/nosql-go-sdk(/[^"]*)?"', '"github\.com/oracle/oci-go-sdk/v[0-9]+/nosql(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.oracle.nosql.sdk:nosqldriver', 'com.oracle.oci.sdk:oci-java-sdk-nosql']
  imports: ['^\s*import\s+oracle\.nosql\.driver\.', '^\s*import\s+com\.oracle\.bmc\.nosql\.']
- ecosystem: nuget
  packages: [Oracle.NoSQL.SDK, OCI.DotNetSDK.Nosql]
  imports: ['^\s*using\s+Oracle\.NoSQL\.SDK\b', '^\s*using\s+Oci\.NosqlService\b']
edge_hints:
- {resource_type: oci_nosql_table, attribute: compartment_id, edge_kind: containment}
- {resource_type: oci_nosql_index, attribute: table_name_or_id, edge_kind: containment}
- {resource_type: oci_nosql_table_replica, attribute: table_name_or_id, edge_kind: containment}
alternatives:
- ref: cassandra
  difficulty: high
  compatibility: conceptual
  notes: Wide-column tables with partition keys map to NoSQL tables; queries and drivers are rewritten.
  approved_by: cloudowski
- ref: scylladb
  difficulty: high
  compatibility: conceptual
  notes: CQL-based target with similar key design; application data access is rewritten.
  approved_by: cloudowski
- ref: mongodb
  difficulty: high
  compatibility: conceptual
  notes: JSON-heavy tables map to documents; queries, indexes and drivers are rewritten.
  approved_by: cloudowski
- ref: yugabytedb
  difficulty: high
  compatibility: conceptual
  notes: YCQL or YSQL tables replace NoSQL tables; data access layer is rewritten.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://docs.oracle.com/en/cloud/paas/nosql-cloud/index.html
  - https://registry.terraform.io/providers/oracle/oci/latest/docs/resources/nosql_table
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
