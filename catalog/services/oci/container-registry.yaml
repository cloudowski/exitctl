schema: '1.0'
kind: service
id: oci.container-registry
provider: oci
name: OCI Container Registry
category: devops.registry
resource_types:
  terraform:
  - oci_artifacts_container_repository
  - oci_artifacts_container_configuration
  - oci_artifacts_container_image_signature
  - oci_artifacts_repository
  - oci_artifacts_generic_artifact
  container_registry:
  - '*.ocir.io'
  - 'ocir.*.oci.oraclecloud.com'
  ci_action: [oracle-actions/login-ocir, oracle-actions/get-ocir-repository]
traits:
- {id: provider-registry, level: low, reason: Standard OCI distribution API; image references and auth tokens point at OCIR hosts.}
- {id: provider-ci-auth, level: low, reason: Pipelines log in with OCI auth tokens or Oracle GitHub actions.}
sdk:
- ecosystem: npm
  packages: [oci-artifacts]
  imports: ['[''"]oci-artifacts[''"]']
- ecosystem: pypi
  imports: ['^\s*from\s+oci\.artifacts\b', '^\s*from\s+oci\s+import\s+.*\bartifacts\b']
  usage: ['\boci\.artifacts\.ArtifactsClient\b']
  gate: [oci]
- ecosystem: go
  packages: [github.com/oracle/oci-go-sdk/v65/artifacts]
  imports: ['"github\.com/oracle/oci-go-sdk/v[0-9]+/artifacts(/[^"]*)?"']
- ecosystem: maven
  packages: ['com.oracle.oci.sdk:oci-java-sdk-artifacts']
  imports: ['^\s*import\s+com\.oracle\.bmc\.artifacts\.']
- ecosystem: nuget
  packages: [OCI.DotNetSDK.Artifacts]
  imports: ['^\s*using\s+Oci\.ArtifactsService\b']
edge_hints:
- {resource_type: oci_artifacts_container_repository, attribute: compartment_id, edge_kind: containment}
- {resource_type: oci_artifacts_container_image_signature, attribute: image_id, edge_kind: reference}
- {resource_type: oci_artifacts_container_image_signature, attribute: kms_key_id, edge_kind: reference}
- {resource_type: oci_artifacts_repository, attribute: compartment_id, edge_kind: containment}
- {resource_type: oci_artifacts_generic_artifact, attribute: repository_id, edge_kind: containment}
alternatives:
- ref: harbor
  difficulty: low
  compatibility: api-compatible
  notes: OCI registry with replication and signing; retag images and update pull secrets.
  approved_by: cloudowski
- ref: forgejo
  difficulty: low
  compatibility: api-compatible
  notes: Built-in container registry next to code hosting; suits smaller image sets.
  approved_by: cloudowski
- ref: gitea
  difficulty: low
  compatibility: api-compatible
  notes: Built-in container registry next to code hosting; suits smaller image sets.
  approved_by: cloudowski
provenance:
  origin: llm
  author: claude
  reviewed_by: cloudowski
  reviewed_on: '2026-10-07'
  status: verified
  sources:
  - https://docs.oracle.com/en-us/iaas/Content/Registry/home.htm
  - https://docs.oracle.com/en-us/iaas/Content/Registry/Concepts/registryprerequisites.htm
  - https://registry.terraform.io/providers/oracle/oci/latest/docs/resources/artifacts_container_repository
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
