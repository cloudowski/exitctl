sdk:
- ecosystem: npm
  packages: [oci-networkfirewall]
  imports: ['[''"]oci-networkfirewall[''"]']
  usage: ['\bcore\.VirtualNetworkClient\b']
  gate: [oci-core, oci-sdk]
- ecosystem: pypi
  imports: ['^\s*from\s+oci\.network_firewall\b', '^\s*from\s+oci\s+import\s+.*\bnetwork_firewall\b']
  usage: ['\boci\.core\.VirtualNetworkClient\b', '\boci\.network_firewall\.\w+']
  gate: [oci]
- ecosystem: go
  packages: [github.com/oracle/oci-go-sdk/v65/networkfirewall]
  imports: ['"github\.com/oracle/oci-go-sdk/v[0-9]+/networkfirewall(/[^"]*)?"']
  usage: ['\bcore\.NewVirtualNetworkClientWithConfigurationProvider\b']
  gate: [github.com/oracle/oci-go-sdk/v65]
- ecosystem: maven
  packages: ['com.oracle.oci.sdk:oci-java-sdk-networkfirewall']
  imports: ['^\s*import\s+com\.oracle\.bmc\.networkfirewall\.']
  usage: ['\bVirtualNetworkClient\b']
  gate: ['com.oracle.oci.sdk:oci-java-sdk-core']
- ecosystem: nuget
  packages: [OCI.DotNetSDK.Networkfirewall]
  imports: ['^\s*using\s+Oci\.NetworkfirewallService\b']
alternatives:
- ref: hetzner
  difficulty: medium
  compatibility: conceptual
  notes: Private networks and firewalls cover basic segmentation; DRG, service gateways and peering are redesigned.
  approved_by: cloudowski
- ref: ovhcloud
  difficulty: medium
  compatibility: conceptual
  notes: vRack and private networks with security groups; network topology is rebuilt.
  approved_by: cloudowski
- ref: scaleway
  difficulty: medium
  compatibility: conceptual
  notes: VPC and Private Networks with security groups; network topology is rebuilt.
  approved_by: cloudowski
- ref: kubernetes
  difficulty: medium
  compatibility: conceptual
  notes: Inside clusters, NetworkPolicy replaces NSG and security list rules between workloads.
  approved_by: cloudowski
