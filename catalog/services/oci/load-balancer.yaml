  - https://registry.terraform.io/providers/oracle/oci/latest/docs/resources/load_balancer_load_balancer
  llm: {batch: 2026-10-06-v01, model: claude-opus-5-5, prompt_version: catalog-draft-v1, eval_passed: true}
