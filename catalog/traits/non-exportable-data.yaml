explanation: Some data cannot leave the service at all (key material, password hashes, tuned model weights), so it must be regenerated or re-enrolled on the target.
exit_hint: Plan re-encryption, password resets or lazy migration at sign-in, and retraining; prefer imported (BYOK) keys and open model weights.
