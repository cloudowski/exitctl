  e2e-offline:
    runs-on: ubuntu-latest
    env:
      # Inside the namespace nothing can be downloaded, so fail fast instead of
      # timing out if a module is missing from the cache.
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Warm module and build caches (with network)
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download
          go test -count=1 -run '^$' ./internal/cli/...
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 (ubuntu-latest) ships AppArmor with
        # kernel.apparmor_restrict_unprivileged_userns=1, which makes
        # `unshare -r` fail with "write failed /proc/self/uid_map: Operation not
        # permitted". `unshare -rn` needs an unprivileged user namespace (to get a
        # private, empty network namespace without root), so relax the
        # restriction for this ephemeral runner only. The sysctl does not exist on
        # older kernels, hence the tolerant check.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          unshare -rn true
      - name: Prove the namespace has no network
        run: |
          # Only a loopback interface (down) exists; any outbound request must fail.
          unshare -rn sh -c 'ip -o link show; if curl -sS --max-time 5 -o /dev/null https://proxy.golang.org; then echo "network reachable inside namespace"; exit 1; fi'
      - name: make e2e-offline
        run: |
          # The Makefile falls back to printing a hint when unshare is missing;
          # make sure that path is not silently taken here.
          command -v unshare
          make e2e-offline

