# CI for exitctl (T096). Releases are built by .github/workflows/release.yml on a "vX.Y.Z" tag.
#
# Maintainer decision: the slow jobs "determinism", "determinism-diff" and "cross" are
# disabled (commented out) to keep CI around two minutes; re-enable them by uncommenting.
# SC-003 stays covered meanwhile by the determinism and golden tests that run in "test".
#
# Jobs:
#   lint              golangci-lint v2 with the repository .golangci.yml
#   test              go test ./... (unit + golden + testscript e2e)
#   (disabled) determinism       make determinism on linux/amd64 and darwin/arm64, plus JSON scan
#                     results of every fixture uploaded as artifacts (SC-003, R15)
#   (disabled) determinism-diff  downloads both result sets and compares them byte for byte
#   e2e-offline       testscript suite inside a network-less user namespace (SC-009, R20)
#   (disabled) cross             make cross (linux/darwin x amd64/arm64)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let the go command fetch a different toolchain: setup-go installs the
  # version from go.mod and that is the one we test.
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2 (the config uses `version: "2"`).
          version: v2.14

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./...

