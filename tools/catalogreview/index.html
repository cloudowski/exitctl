<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Review</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f6fde; --accent-ink: #ffffff; --sel: #eaf1fd;
  --draft: #a15c00; --draft-bg: #fff3e0; --ver: #137a3f; --ver-bg: #e5f6ec;
  --dep: #6b7280; --dep-bg: #eceef1; --warn: #b42318; --warn-bg: #fdecea; --star: #d99a00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1b1f26; --ink: #e6e8ec; --muted: #98a1b0; --line: #2c323c;
    --accent: #6c9cf0; --accent-ink: #0f1217; --sel: #233046;
    --draft: #f0b35e; --draft-bg: #3a2c16; --ver: #6fd39a; --ver-bg: #183326;
    --dep: #a3a9b4; --dep-bg: #2a2f38; --warn: #f39b91; --warn-bg: #3d1f1c; --star: #f4c542;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
.progress { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; }
.prog { font-size: 12px; color: var(--muted); min-width: 120px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; background: var(--ver); }
main { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; height: calc(100vh - 58px); }
@media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #list { max-height: 50vh; } }
aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.filters { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.filters input[type=search] { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#bulk { display: none; padding: 8px 10px; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); background: var(--sel); font-size: 13px; flex-wrap: wrap; }
#bulk.show { display: flex; }
#list { overflow: auto; flex: 1; }
.row { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--bg); }
.row.cur { background: var(--sel); }
.row .id { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.s-draft { color: var(--draft); background: var(--draft-bg); }
.s-verified { color: var(--ver); background: var(--ver-bg); }
.s-deprecated, .s-missing { color: var(--dep); background: var(--dep-bg); }
.warnmark { color: var(--warn); font-weight: 700; margin-left: 4px; }
section#detail { overflow: auto; padding: 18px 22px 40px; }
.empty { color: var(--muted); margin-top: 40px; text-align: center; }
.dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.dhead h2 { margin: 0; font-size: 20px; }
.dhead .id { font-family: var(--mono); color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
button.btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.btn.small { padding: 2px 8px; font-size: 12px; }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
.warnings { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin: 10px 0; }
.warnings div::before { content: "! "; font-weight: 700; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.mono, .mono { font-family: var(--mono); font-size: 12.5px; }
.star { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--line); padding: 0 4px; line-height: 1; }
.star.on { color: var(--star); }
.star:disabled { cursor: not-allowed; }
a.link { color: var(--accent); cursor: pointer; text-decoration: none; }
a.link:hover { text-decoration: underline; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; font: 12px/1.45 var(--mono); }
details summary { cursor: pointer; color: var(--muted); margin-top: 18px; }
#toast { position: fixed; right: 16px; bottom: 16px; max-width: 560px; padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); display: none; white-space: pre-wrap; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
#toast.err { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
#toast.show { display: block; }
.help { color: var(--muted); font-size: 12px; }
select, input.reason { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); }
input.reason { width: 100%; min-width: 180px; }
.override { font-size: 11px; color: var(--accent); font-weight: 600; }
.levelrow { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Catalog Review</h1>
  <span class="meta" id="meta"></span>
  <div class="progress" id="progress"></div>
</header>
<main>
  <aside>
    <div class="filters">
      <input type="search" id="q" placeholder="Search id, name, provider, category  ( / )">
      <div class="chips" id="kinds"></div>
      <div class="chips" id="statuses"></div>
      <div class="help"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>v</kbd> verify · <kbd>d</kbd> draft · <kbd>x</kbd> deprecate · <kbd>space</kbd> select</div>
    </div>
    <div id="bulk">
      <span id="bulkcount"></span>
      <button class="btn small primary" data-bulk="verified">Verify</button>
      <button class="btn small" data-bulk="draft">Back to draft</button>
      <button class="btn small" data-bulk="deprecated">Deprecate</button>
      <button class="btn small" id="bulkclear">Clear</button>
    </div>
    <div id="list"></div>
  </aside>
  <section id="detail"><div class="empty">Select an entry to review it.</div></section>
</main>
<div id="toast"></div>
<script>
"use strict";
const TOKEN = "{{TOKEN}}";
const KINDS = ["service", "trait", "alternative", "neutral"];
const STATUSES = ["draft", "verified", "deprecated", "warnings"];
let state = null, current = null, detail = null, curIdx = 0;
const filt = { q: "", kinds: new Set(["service"]), statuses: new Set(["draft"]) };
const selected = new Set();

// h builds DOM nodes; children that are strings become text nodes (no HTML parsing).
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "X-Review-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) { const e = new Error(data.error || res.statusText); e.problems = data.problems; throw e; }
  return data;
}

function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.className = "", err ? 9000 : 2200);
}

async function act(fn, okMsg) {
  try { await fn(); await refresh(); if (okMsg) toast(okMsg); }
  catch (e) { toast(e.message + (e.problems ? "\n\n" + e.problems.join("\n") : ""), true); }
}

const badge = s => h("span", { class: "badge s-" + s }, s);

function visible() {
  const q = filt.q.toLowerCase();
  return state.entries.filter(e => {
    if (filt.kinds.size && !filt.kinds.has(e.kind)) return false;
    const st = [...filt.statuses].filter(s => s !== "warnings");
    if (st.length && !st.includes(e.status)) return false;
    if (filt.statuses.has("warnings") && !(e.warnings || []).length) return false;
    if (q && ![e.id, e.name, e.provider, e.category, e.file].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderHeader() {
  document.getElementById("meta").textContent =
    `${state.catalog} · catalog ${state.version} · reviewer ${state.reviewer}` +
    (state.can_recommend ? "" : " (not a maintainer: recommending disabled)") +
    (state.problems.length ? ` · ${state.problems.length} validation problems` : " · valid");
  const p = document.getElementById("progress"); p.replaceChildren();
  for (const k of KINDS) {
    const s = state.stats[k] || {}; const total = (s.draft || 0) + (s.verified || 0) + (s.deprecated || 0);
    if (!total) continue;
    const pct = Math.round(100 * (s.verified || 0) / total);
    p.append(h("div", { class: "prog" }, `${k}s ${s.verified || 0}/${total} verified`,
      h("div", { class: "bar" }, h("i", { style: `width:${pct}%` }))));
  }
}

function chipRow(id, values, set, label) {
  const el = document.getElementById(id); el.replaceChildren();
  for (const v of values) {
    const n = v === "warnings" ? "has warnings" : label(v);
    el.append(h("button", { class: "chip" + (set.has(v) ? " on" : ""), onclick: () => {
      set.has(v) ? set.delete(v) : set.add(v); renderFilters(); renderList(); } }, n));
  }
}

function renderFilters() {
  const count = k => state.entries.filter(e => e.kind === k).length;
  chipRow("kinds", KINDS, filt.kinds, k => `${k}s (${count(k)})`);
  chipRow("statuses", STATUSES, filt.statuses, s => s);
}

function renderList() {
  const list = document.getElementById("list"); list.replaceChildren();
  const rows = visible();
  if (!rows.length) list.append(h("div", { class: "empty" }, "Nothing matches the filters."));
  for (const e of rows) {
    const sub = [e.name !== e.id ? e.name : "", e.kind === "service" ? e.category : e.kind,
      e.used_by ? `used by ${e.used_by}` : "", e.recommended ? `★ ${e.recommended}` : ""].filter(Boolean).join(" · ");
    const cb = h("input", { type: "checkbox", checked: selected.has(e.file), onclick: ev => {
      ev.stopPropagation(); ev.target.checked ? selected.add(e.file) : selected.delete(e.file); renderBulk(); } });
    list.append(h("div", { class: "row" + (current === e.file ? " cur" : ""), "data-file": e.file, onclick: () => open(e.file) },
      cb,
      h("div", {}, h("div", { class: "id" }, e.id, (e.warnings || []).length ? h("span", { class: "warnmark", title: e.warnings.join("\n") }, "!") : null),
        h("div", { class: "sub" }, sub)),
      badge(e.status)));
  }
  renderBulk();
}

function renderBulk() {
  const b = document.getElementById("bulk");
  b.className = selected.size ? "show" : "";
  document.getElementById("bulkcount").textContent = `${selected.size} selected`;
}

async function open(file) {
  current = file;
  const vi = visible().findIndex(e => e.file === file); if (vi >= 0) curIdx = vi;
  if (location.hash.slice(1) !== file) history.replaceState(null, "", "#" + file);
  for (const r of document.querySelectorAll(".row")) r.classList.toggle("cur", r.dataset.file === file);
  try { detail = await api("GET", "/api/entry?file=" + encodeURIComponent(file)); renderDetail(); }
  catch (e) { toast(e.message, true); }
}

function setStatus(files, status) {
  const verb = { verified: "Verified", draft: "Moved back to draft", deprecated: "Deprecated" }[status];
  return act(() => api("POST", "/api/status", { files, status }), `${verb}: ${files.length} ${files.length === 1 ? "entry" : "entries"}`);
}

function levelSelect(value, withDefault) {
  const sel = h("select", {});
  if (withDefault) sel.append(h("option", { value: "" }, `default (${withDefault})`));
  for (const l of state.levels) sel.append(h("option", { value: l }, l));
  sel.value = value;
  return sel;
}

// traitLevelControl edits a trait's default level.
function traitLevelControl(d) {
  const sel = levelSelect(d.level);
  const save = h("button", { class: "btn small", disabled: true, onclick: () =>
    act(() => api("POST", "/api/trait-level", { file: d.file, level: sel.value }), `${d.name}: default level ${sel.value}`) }, "Save");
  sel.addEventListener("change", () => save.disabled = sel.value === d.level);
  const users = (d.used_by_list || []).length;
  return h("div", {}, h("div", { class: "levelrow" }, sel, save),
    h("div", { class: "help" }, `Applies to the ${users} services using this trait, except where a service overrides it.`));
}

// traitRefRow shows one trait of a service with its level override.
function traitRefRow(d, t) {
  const sel = levelSelect(t.override_level || "", t.default_level || "?");
  const reason = h("input", { class: "reason", type: "text", value: t.reason || "", placeholder: "why this service differs from the default" });
  const save = h("button", { class: "btn small", disabled: true }, "Save");
  const changed = () => sel.value !== (t.override_level || "") || (sel.value && reason.value.trim() !== (t.reason || ""));
  const sync = () => { reason.disabled = !sel.value; save.disabled = !changed() || (sel.value && !reason.value.trim()); };
  sel.addEventListener("change", sync); reason.addEventListener("input", sync); sync();
  save.addEventListener("click", () => act(() => api("POST", "/api/trait-ref-level",
    { file: d.file, trait: t.id, level: sel.value, reason: sel.value ? reason.value : "" }),
    sel.value ? `${t.name || t.id}: ${sel.value} on ${d.name}` : `${t.name || t.id}: back to default on ${d.name}`));
  return h("tr", {},
    h("td", {}, t.file ? h("a", { class: "link", onclick: () => jump(t.file) }, t.name || t.id) : t.id,
      t.override_level ? h("div", { class: "override" }, "override") : null),
    h("td", {}, sel), h("td", {}, badge(t.status)), h("td", {}, reason), h("td", {}, save));
}

function renderDetail() {
  const d = detail, el = document.getElementById("detail"); el.replaceChildren();
  el.append(h("div", { class: "dhead" }, h("h2", {}, d.name), h("span", { class: "id" }, d.id), badge(d.status),
    h("span", { class: "meta" }, d.kind + (d.origin ? ` · origin ${d.origin}` : ""))));
  const isAlt = d.kind === "alternative";
  el.append(h("div", { class: "actions" },
    h("button", { class: "btn primary", disabled: d.status === "verified", onclick: () => setStatus([d.file], "verified") }, "Verify ", h("kbd", {}, "v")),
    h("button", { class: "btn", disabled: d.status === "draft", onclick: () => setStatus([d.file], "draft") }, "Back to draft ", h("kbd", {}, "d")),
    h("button", { class: "btn", disabled: d.status === "deprecated", onclick: () => setStatus([d.file], "deprecated") },
      isAlt ? "Hide everywhere (deprecate) " : "Deprecate ", h("kbd", {}, "x"))));
  if (d.status === "verified" && d.reviewed_by) el.append(h("div", { class: "meta" }, `Reviewed by ${d.reviewed_by} on ${d.reviewed_on}`));
  if (d.origin === "llm" && d.status !== "verified")
    el.append(h("div", { class: "help" }, "Verifying an LLM draft records that it passed your review (llm.eval_passed: true)."));
  if ((d.warnings || []).length) el.append(h("div", { class: "warnings" }, d.warnings.map(w => h("div", {}, w))));

  const facts = [];
  const fact = (k, v) => v && facts.push(h("dt", {}, k), h("dd", {}, v));
  fact("Provider", d.provider); fact("Category", d.category); fact("Kind", d.alternative_kind);
  fact("License", d.license);
  if (d.homepage) facts.push(h("dt", {}, "Homepage"), h("dd", {}, h("a", { class: "link", href: d.homepage, target: "_blank", rel: "noopener noreferrer" }, d.homepage)));
  if (d.kind === "trait") facts.push(h("dt", {}, "Default level"), h("dd", {}, traitLevelControl(d)));
  fact("Explanation", d.explanation); fact("Exit hint", d.exit_hint);
  if (d.kind === "neutral") fact("Scored", d.not_scored
    ? "no - deploys nothing; matched resources are left out of the score and coverage (scored: false)"
    : "yes - matched resources count as portable (risk 0)");
  for (const [k, v] of Object.entries(d.resource_types || {})) fact(k, h("span", { class: "mono" }, v));
  if (d.llm) fact("LLM", `batch ${d.llm.batch} · ${d.llm.model} · prompt ${d.llm.prompt_version} · eval_passed ${d.llm.eval_passed}`);
  fact("File", h("span", { class: "mono" }, d.file));
  el.append(h("h3", {}, "Details"), h("dl", {}, facts));

  if (d.traits) {
    el.append(h("h3", {}, "Traits"),
      h("div", { class: "help" }, "Pick a level to override the trait's default for this service (a reason is required), or choose \"default\" to remove the override."),
      h("table", {},
        h("tr", {}, h("th", {}, "Trait"), h("th", {}, "Level"), h("th", {}, "Status"), h("th", {}, "Reason"), h("th", {}, "")),
        d.traits.map(t => traitRefRow(d, t))));
  }
  if (d.mappings) {
    const canRec = state.can_recommend;
    el.append(h("h3", {}, "Alternatives"),
      h("div", { class: "help" }, "★ marks a recommended alternative (shown first, never affects scores). Remove drops the mapping from this service only; to hide an alternative everywhere, open it and deprecate it."),
      h("table", {},
        h("tr", {}, h("th", {}, ""), h("th", {}, "Alternative"), h("th", {}, "Status"), h("th", {}, "Difficulty"),
          h("th", {}, "Compatibility"), h("th", {}, "Notes"), h("th", {}, "")),
        d.mappings.map(m => h("tr", {},
          h("td", {}, h("button", { class: "star" + (m.recommended ? " on" : ""), disabled: !canRec,
            title: canRec ? (m.recommended ? "Unmark recommended" : "Mark recommended") : "Only maintainers can recommend",
            onclick: () => act(() => api("POST", "/api/recommend", { file: d.file, ref: m.ref, on: !m.recommended }),
              m.recommended ? `Unmarked ${m.name}` : `Recommended ${m.name}`) }, "★")),
          h("td", {}, m.file ? h("a", { class: "link", onclick: () => jump(m.file) }, m.name) : m.ref,
            m.approved_by ? h("div", { class: "help" }, "approved by " + m.approved_by) : null),
          h("td", {}, badge(m.status)), h("td", {}, m.difficulty), h("td", {}, m.compatibility),
          h("td", {}, m.notes || ""),
          h("td", {}, h("button", { class: "btn small", onclick: () => {
            if (confirm(`Remove ${m.name} from ${d.name}? (git keeps the history)`))
              act(() => api("POST", "/api/remove-mapping", { file: d.file, ref: m.ref }), `Removed ${m.name}`);
          } }, "Remove"))))));
  }
  if (d.used_by_list) {
    el.append(h("h3", {}, `Used by ${d.used_by_list.length} services`),
      d.used_by_list.length ? h("table", {}, h("tr", {}, h("th", {}, "Service"), d.kind === "trait" ? h("th", {}, "Level") : null, h("th", {}, "Status"), h("th", {}, "")),
        d.used_by_list.map(u => h("tr", {}, h("td", {}, h("a", { class: "link", onclick: () => jump(u.file) }, u.name), " ", h("span", { class: "mono meta" }, u.id)),
          d.kind === "trait" ? h("td", {}, u.override_level ? h("span", {}, u.override_level, " ", h("span", { class: "override" }, "override")) : h("span", { class: "meta" }, `default (${d.level})`)) : null,
          h("td", {}, badge(u.status)), h("td", {}, u.recommended ? "★ recommended" : ""))))
        : h("div", { class: "help" }, "No service references this entry."));
  }
  if ((d.sources || []).length) {
    el.append(h("h3", {}, "Sources"), h("ul", {}, d.sources.map(s =>
      h("li", {}, h("a", { class: "link", href: s, target: "_blank", rel: "noopener noreferrer" }, s)))));
  }
  el.append(h("details", {}, h("summary", {}, "YAML source"), h("pre", {}, d.yaml)));
}

// jump opens an entry even if the filters hide it.
function jump(file) {
  const e = state.entries.find(x => x.file === file);
  if (e && !visible().includes(e)) { filt.kinds.add(e.kind); filt.statuses.clear(); renderFilters(); renderList(); }
  open(file);
}

async function refresh() {
  state = await api("GET", "/api/state");
  for (const f of [...selected]) if (!state.entries.some(e => e.file === f)) selected.delete(f);
  renderHeader(); renderFilters(); renderList();
  if (current) await open(current);
}

function move(delta) {
  const rows = visible(); if (!rows.length) return;
  let i = rows.findIndex(e => e.file === current);
  // When the current entry left the list (e.g. verified under the draft
  // filter), the next entry has moved into its position.
  if (i < 0) i = delta > 0 ? curIdx : curIdx - 1;
  else i += delta;
  i = Math.max(0, Math.min(rows.length - 1, i));
  open(rows[i].file);
  document.querySelector(`.row[data-file="${CSS.escape(rows[i].file)}"]`)?.scrollIntoView({ block: "nearest" });
}

document.getElementById("q").addEventListener("input", ev => { filt.q = ev.target.value; renderList(); });
for (const b of document.querySelectorAll("[data-bulk]"))
  b.addEventListener("click", () => setStatus([...selected], b.dataset.bulk).then(() => { selected.clear(); renderList(); }));
document.getElementById("bulkclear").addEventListener("click", () => { selected.clear(); renderList(); });
document.addEventListener("keydown", ev => {
  if ((ev.target.tagName === "INPUT" && ev.target.type !== "checkbox") || ev.target.tagName === "SELECT") {
    if (ev.key === "Escape") ev.target.blur();
    return;
  }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key;
  if (k === "j" || k === "ArrowDown") { move(1); ev.preventDefault(); }
  else if (k === "k" || k === "ArrowUp") { move(-1); ev.preventDefault(); }
  else if (k === "/") { document.getElementById("q").focus(); ev.preventDefault(); }
  else if (current && k === "v") setStatus([current], "verified");
  else if (current && k === "d") setStatus([current], "draft");
  else if (current && k === "x") setStatus([current], "deprecated");
  else if (current && k === " ") { selected.has(current) ? selected.delete(current) : selected.add(current); renderList(); ev.preventDefault(); }
});
refresh().then(() => { const f = decodeURIComponent(location.hash.slice(1)); if (f) jump(f); })
  .catch(e => toast(e.message, true));
</script>
</body>
</html>
