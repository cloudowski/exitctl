AWSTemplateFormatVersion: "2010-09-09"
Description: Order notifications

Resources:
  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: orders-notifications

  OrdersTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: orders

  OrdersSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrdersTopic
      Protocol: sqs
      Endpoint: !GetAtt OrdersQueue.Arn

Outputs:
  QueueUrl:
    Value: !Ref OrdersQueue
