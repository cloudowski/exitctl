apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
  labels:
    app: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      serviceAccountName: orders-api
      containers:
        - name: orders-api
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/orders-api:1.4.2
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-config
          volumeMounts:
            - name: cache
              mountPath: /var/cache/orders
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: orders-cache
